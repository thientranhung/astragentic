<!doctype html><html><head><meta charset="utf-8"><style>
  @font-face{font-family:'Inter Variable';src:local('Inter');}
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:#FF00FF}body{width:1200px;height:630px;background:#F2F3F6;font-family:Inter,'SF Pro Text',-apple-system,system-ui,sans-serif;color:#14161A;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px;position:relative;overflow:hidden}
  .grid{position:absolute;inset:0 0 auto 0;height:180px;background:
     repeating-linear-gradient(90deg,rgba(229,54,37,.10) 0 1px,transparent 1px 60px),
     linear-gradient(180deg,rgba(229,54,37,.10),transparent);}
  .brand{display:flex;align-items:center;gap:14px;position:relative}
  .mark{width:34px;height:34px;border-radius:6px;background:#E53625;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;line-height:1}
  .name{font-weight:800;font-size:26px;letter-spacing:-0.01em}
  .by{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#6B7280}
  h1{font-size:66px;line-height:1.07;letter-spacing:-0.02em;font-weight:800;max-width:980px}
  h1 em{font-style:normal;color:#E53625}
  p{font-size:26px;line-height:1.45;color:#4B5563;max-width:900px;margin-top:22px}
  .foot{display:flex;align-items:center;gap:16px;font-family:ui-monospace,Menlo,monospace;font-size:17px;color:#6B7280}
  .dot{width:9px;height:9px;border-radius:50%;background:#E53625}
</style></head><body>
  <div class="grid"></div>
  <div class="brand"><span class="mark">A</span><span class="name">ASTRAGENTIC</span><span class="by">by Astraler</span></div>
  <div>
    <h1>A scaffold for running a team of <em>AI agents</em>.</h1>
    <p>One representative to talk to, agents with clear roles to build, an issue tracker at the centre.</p>
  </div>
  <div class="foot"><span class="dot"></span><span>Autonomous coding · astragentic.thisistool.com</span></div>
</body></html>
