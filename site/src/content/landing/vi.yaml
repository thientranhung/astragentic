harness: v6.1.19
hero:
  eyebrow: "Autonomous coding · **cho dự án nhiều milestone** · v{{meta.version}}"
  headline: "Một team outsource bằng AI agent.\nVận hành đúng quy trình, **liên tục 24/7**, cho **những dự án lớn**."
  sub: "Astragentic là scaffold để vận hành một team AI agent theo mô hình orchestrator. Bạn trao đổi với một người đại diện, team thi công theo role, và mọi việc đi qua issue tracker: GitHub Issues, Jira hoặc Linear. Những phần khó của việc điều hành nhiều agent đã được giải quyết sẵn; phần còn lại là của bạn."
  primary: "Khám phá cách hoạt động ↓"
  secondary: "Cài vào repo của bạn"

explain:
  runtimes:
    commands:
      label: "Mở agent qua CLI"
      lines:
        - "claude   --dangerously-skip-permissions --agent builder --model <model> --effort <low|medium|high|xhigh|max>"

  customize:
    eyebrow: "Tuỳ biến"
    headline: "Mỗi người một cách làm việc với AI. Astragentic là bộ khung cho người theo trường phái agent orchestration."
    paragraphs:
      - "Không có một cách làm việc với AI đúng cho tất cả. Astragentic không chọn thay bạn."
    bullets:
      - "**Đủ vòng SDLC**: sáu role, review ba lens cùng một model của hãng khác, QA walk trước merge, slice gate khi một slice đóng."
      - "**Tối giản**: hai agent, một người đại diện và một người thi công."
      - "**Theo hạ tầng của bạn**: đổi tracker, đổi runtime, thêm một bước review riêng."
    paragraphsAfter:
      - "Tuỳ biến là sửa file trong bản checkout của bạn. Mỗi role là một contract, mỗi skill là một thư mục, mỗi hook là một script."
      - "Đường đưa thay đổi tới dự án là đường phát hành: tăng `VERSION`, ghi một mục trong `RELEASE-NOTES.md`, rồi cập nhật dự án bằng `.astraler/astragentic.sh update --apply`. Bước thích nghi trong dự án so bản mới với bản đang chạy và giữ nguyên các file thuộc về bạn, như `orchestrator.md`."

  selfRepair:
    eyebrow: "Tự sửa chữa"
    headline: "Bộ khung học từ mỗi vòng làm việc, và luật rút ra đi thẳng vào file agent đọc."
    paragraphs:
      - "Một team agent lặp lại lỗi của chính nó nếu không có chỗ nào ghi lại. Ở đây có: mỗi sự cố là một dòng trong một cuốn sổ chỉ thêm, mang mã cố định, không đánh số lại và không xoá."
      - "Dòng nào rút ra được luật thì luật đó viết thẳng vào contract của role, vào skill hoặc vào hook — những file agent đọc ở đầu session. Lần dispatch sau cả team làm khác đi, không phải vì ai nhớ, mà vì văn bản đã đổi."
    commands:
      label: "Phần cuối của một commit merge"
      lines:
        - "Pass: astra-review, simplify, arm"
        - "Ledger: AST-136 — --grep is BASIC regex, and every marker kind"
        - "        in this system contains parentheses"
    bullets:
      - "**Khép lại ở lúc merge**: commit merge mang một dòng `Ledger:` nói rõ cái gì vừa vào sổ. `Ledger: none` là hợp lệ; thiếu hẳn dòng đó thì không."
      - "**Không có bước build**: luật nằm trong chính file contract, agent đọc nó ở đầu session. Một hook nạp lại contract sau khi session bị compact."
      - "**Sổ chỉ thêm**: dòng chưa rút ra được luật vẫn nằm nguyên đó. Một hồ sơ chờ trung thực hơn một cuốn sổ chỉ chứa những lần đã giải quyết xong."
    paragraphsAfter:
      - "Cùng cơ chế đó cho phép một **agent tự tuỳ biến bộ khung**. Toàn bộ Astragentic là văn bản — contract, skill, hook — không có binary, không có config schema phải học. Bạn mở một session ngay trong bản checkout, mô tả cách mình muốn làm việc, nó đề xuất diff, bạn duyệt."
    more:
      label: "Đọc cơ chế đầy đủ →"
      href: "/vi/tuy-bien/#self-repair"

  comms:
    eyebrow: "Giao tiếp giữa các agent"
    headline: "Dispatch một ticket là mở một cuộc trao đổi có địa chỉ."
    paragraphs:
      - "Ticket là một issue trên tracker, cắt đủ nhỏ để một Builder hoàn thành trong một session. Nó mang một id ổn định, một trạng thái, một assignee, và các blocking edge tới việc phải xong trước."
      - "Thomas dispatch theo skill `dispatch-ticket`: claim trên tracker, tạo branch và worktree, mở pane trên host đang chạy (Herdr hoặc Orca), launch agent theo role, gửi brief. Mod `astragentic-dispatch` ghi record cho pane và đánh thức Thomas khi pane kết thúc lượt. Chuỗi ticket → assignee → pane → worktree → branch → PR là một-một, nên nhiều Builder chạy song song mà không tranh chấp."
      - "Giữa các session Claude Code, kênh chính là cross-session messaging có sẵn. Mỗi session có một tên; Thomas tra tên bằng ListAgents rồi gửi thẳng. Ở đầu nhận, thông điệp hiện thành dòng preview `› Message from @thomas: …`, mở rộng bằng ctrl+o, và câu trả lời đi ngược về đúng session đã gửi."
      - "Host terminal là mặt phẳng nhìn thấy: mỗi agent một pane có tên và trạng thái. Herdr là host mặc định, Orca chạy song song từ 6.1.0, và mỗi session đúng một host: lệnh của host kia bị từ chối."
    bullets:
      - "**Câu hỏi kỹ thuật**: Thomas trả lời thay bạn, từ contract, spec và tracker."
      - "**Quyết định thiết kế**: đi lên bạn dưới dạng câu hỏi đánh số, mỗi câu kèm đề xuất, như `astra-grill-with-docs` làm."
      - "**Vị trí của bạn**: đứng trên vòng lặp, không đứng trong từng bước của nó."
  roles:
    eyebrow: "AI outsource team"
    headline: "Công việc của mỗi agent."
    paragraphs:
      - "Mỗi thành viên trong team là một agent: một session **Claude Code** mở từ CLI với một role cố định. Nó nhận việc, làm xong thì trả kết quả, và có thể nhân bản: nhiều Builder cùng thi công, nhiều QA cùng kiểm, như một team thật."
      - "Mỗi role có một tên riêng: Thomas, BA, Shaper, Builder, QA, Quick Builder. Tên riêng giữ agent không trôi khỏi role của mình trong context dài, và là địa chỉ để gửi việc, đọc pane, gắn đúng skill."
    figureNote: "Bạn làm việc với Thomas. Thomas gọi Shaper khi cần spec, dispatch ticket cho Builder, gọi QA walk trước khi merge, mở Quick Builder cho việc nhỏ, rồi báo lại bạn. BA thì bạn tự mở khi cần làm rõ một vấn đề."
    models:
      label: "Model và effort theo role"
      intro: "Agent của mỗi role chạy trên model và effort hợp với việc của role đó. Model và effort của từng role là một dòng trong `orchestrator.md`, nên bạn cân chi phí và chất lượng theo từng role thay vì một model cho tất cả."
      note: "Bảng này đọc thẳng từ `.agents/orchestrator.md` trong repo của bạn. Đổi một dòng là đổi runtime, model hay effort của role đó ở lần dispatch kế tiếp, không cần sửa contract của role."
    items:
      - id: thomas
        title: "Thomas"
        tag: "deputy"
        session: "Session thường trực, kéo dài qua nhiều ticket."
        body: "Deputy của bạn: giữ tracker, frontier, claim, dispatch và merge. Merge bằng artifact, không bằng lời handback. Hỏi lại bạn ở những quyết định quan trọng."
        href: "/vi/role/thomas/"
      - id: ba
        title: "BA"
        tag: "làm rõ vấn đề"
        session: "Bạn tự mở khi cần, chỉ đọc."
        body: "Ngồi ghế người dùng, đi thử sản phẩm đang chạy, nêu trade-off và việc đang chạy bị ảnh hưởng, bàn giao bằng một file hoặc một ticket bạn duyệt."
        href: "/vi/role/ba/"
      - id: shaper
        title: "Shaper"
        tag: "định hình"
        session: "Một session liền mạch từ đầu tới cuối, không compact."
        body: "Chạy astra-grill-with-docs, astra-to-spec, astra-to-tickets theo thứ tự, dừng sau spec để arm đọc spec."
        href: "/vi/role/shaper/"
      - id: builder
        title: "Builder"
        tag: "thi công"
        session: "Một session mỗi ticket, trong worktree riêng, là người viết duy nhất ở đó."
        body: "Build test-first, UI pass, review ba lens, simplify một lần, rồi lượt đọc chéo của Codex. Commit ở mỗi ranh giới pha, không chỉ lúc handback."
        href: "/vi/role/builder/"
      - id: qa
        title: "QA"
        tag: "nghiệm thu"
        session: "Một session mỗi lượt walk, với sản phẩm đang chạy thật trong worktree riêng."
        body: "Dùng sản phẩm như người dùng, không đọc diff. Mặc định chỉ đọc, mọi thao tác ghi cần bạn cho phép từng lần."
        href: "/vi/role/qa/"
      - id: quick-builder
        title: "Quick Builder"
        tag: "việc nhỏ"
        session: "Một session mỗi việc nhỏ, không ticket."
        body: "Làm thay đổi bạn đánh giá bằng mắt trên nhánh ops/*, cho bạn xem trước và sau, rồi fast-forward vào main."
        href: "/vi/role/quick-builder/"

  tracker:
    eyebrow: "Issue tracker"
    headline: "Mọi việc đi qua tracker, nên không việc nào lạc hướng."
    paragraphs:
      - "Trạng thái công việc được lưu trên tracker, không trong chat hay trí nhớ của một agent. Thomas hỏi tracker cái gì đã sẵn sàng; bạn mở board là đọc được."
    bullets:
      - "**Ticket là dữ liệu**: id, status, assignee, blocking edge, đọc và ghi qua API. Không còn ô tick trong file markdown mà agent phải nhớ sửa."
      - "**Claim là một dòng assignee** ghi và đọc lại được, nên nhiều Builder chạy song song."
      - "**Một ticket là một branch, một worktree, một PR**, cùng mã ticket trong tên. Merge xong thì ticket đóng, worktree dọn."
      - "**Ticket giữ cả câu chuyện**: nội dung việc, cách làm, câu hỏi đã hỏi, receipt đã commit. Bạn hiểu một việc bằng cách mở ticket."
      - "**Không có công cụ mới phải học**: GitHub Issues, Jira, Linear đều dùng được."
    items:
      - text: "A stable ticket id in the TITLE"
      - text: "A status with five states — Backlog / Todo / In Progress / Done / Won't fix"
      - text: "An assignee, written and read back atomically"
      - text: "Every precondition as a queryable EDGE"
      - text: "A surface the OWNER can open and read without running a query"
    more:
      label: "Khám phá cấu trúc →"
      href: "/vi/cau-truc/#coordination"

  method:
    eyebrow: "Skill astra-*"
    headline: "Phương pháp phát triển là bảy skill astra-* của chính harness."
    paragraphs:
      - "Mỗi skill gắn với đúng role và đúng pha dùng nó, và ship cùng release với mod và script merge gọi tên nó."
    bullets:
      - "**Nửa định hình**: astra-ux ghi journey cùng bạn, astra-grill-with-docs hỏi tới khi không còn nhánh mở, astra-to-spec chốt spec, astra-to-tickets cắt thành ticket."
      - "**Nửa thi công**: astra-implement-with-tdd, astra-ui đối chiếu bề mặt với design spine, astra-review chạy ba lens trong một lượt."
      - "**Lặp ở đầu, không lặp ở cuối**: quyết định chốt trước khi viết code, nên mọi review phía sau là một lượt có biên."
    items:
      - id: thomas
        title: "Thomas"
        text: "astra-ux · reconcile-tracker · dispatch-ticket · dispatch-qa-walk"
      - id: shaper
        title: "Shaper"
        text: "astra-grill-with-docs → astra-to-spec → astra-to-tickets · test-design"
      - id: builder
        title: "Builder"
        text: "astra-implement-with-tdd · astra-ui · astra-review · codex-arm"
      - title: "Dùng chung"
        text: "simplify · code-review (built-in của Claude Code) · github / jira / linear-issue-tracker"
    more:
      label: "Hiểu rõ hơn lý do →"
      href: "/vi/cach-tiep-can/#why-astra-skills"

why:
  eyebrow: "Cách tiếp cận"
  headline: "AI đã là một developer thực thụ. Astragentic đặt bạn vào vị trí người dẫn dắt team developer đó."
  p1: "Coding agent hôm nay nhận việc, viết code, chạy test và sửa cho tới khi xanh. Khi thực thi không còn là nút thắt, giá trị của người kỹ sư chuyển sang chỗ khác: đặt yêu cầu đúng, quyết định đúng, giữ quy trình đi đúng hướng."
  p2: "Astragentic được xây để bạn làm đúng phần đó. Nó tổ chức các agent thành một team outsource theo kỷ luật SDLC quen thuộc, và thiết kế lại cách dispatch, review, handback để khai thác tốc độ mà một team người không duy trì được."
  more: "Khám phá toàn bộ cách tiếp cận →"

