features:
  - id: cross-vendor
    title: "Review gate hai lớp, hai vendor."
    body: "Mọi ticket đi qua code-review theo Standards và Spec trên Claude Code, rồi một lượt đọc chéo trên Codex. Hai model của hai vendor đọc cùng một diff trước khi merge, nên chất lượng không phụ thuộc vào một model duy nhất."
    diagram: cross-vendor-arm
    crop: [builder, codex, head]
    href: /skills/codex-arm
  - id: tracker
    title: "Vận hành liên tục quanh issue tracker."
    body: "Mọi yêu cầu, spec và ticket đều nằm trên tracker. Review phát hiện việc mới thì ghi thành ticket mới. Đội chạy 24/7 mà không cần bạn ngồi canh, và không có việc nào rơi ra ngoài hệ thống."
    diagram: frontier-query
    crop: [frontier_query, board]
    href: /cau-truc#coordination
  - id: roles
    title: "Đội có tên, có vai, có contract."
    body: "Thomas đại diện, Shaper định hình, Builder thi công, Rin giữ gate, QA nghiệm thu. Mỗi vai có contract và system context riêng, nên trách nhiệm rõ và không ai làm thay việc của ai. Claude Code, Codex và OpenCode đều hỗ trợ agent profile ở mức này."
    diagram: five-roles
    crop: [shaper, builder]
    href: /vai/thomas
  - id: runtime
    title: "Một quy trình, nhiều runtime."
    body: "Claude Code là nền bắt buộc; Codex và OpenCode thêm vào khi bạn cần vendor thứ hai hay model khác. Vai nào chạy trên runtime nào khai trong orchestrator.md; đổi runtime không đổi quy trình."
    diagram: structure
    crop: [runtime_claude, runtime_codex]
    href: /tech-stack#claude-code
  - id: models
    title: "Đúng model cho đúng việc."
    body: "Sonnet cho Builder và QA, nơi cần nhanh và rẻ; Opus cho Thomas, Shaper và Rin, nơi cần suy luận dài. Chi phí và chất lượng cân theo từng vai thay vì một model cho tất cả."
    href: /vai/builder
  - id: oversight
    title: "Toàn quyền giám sát, không cần ra tay."
    body: "Board tracker, pane herdr, thiết kế và quyết định đều đọc lại được. Thomas hỏi lại bạn ở những điểm quan trọng: UI/UX, lựa chọn tech stack. Bạn quyết, đội làm."
    diagram: hub-and-spokes
    crop: [tra139, tra142]
    href: /vai/thomas

fit:
  eyebrow: "Quy mô phù hợp"
  headline: "Dành cho dự án dài hơi, nhiều phần, chạy song song."
  body: "Một dự án lớn không lớn vì có sprint hay story. Nó lớn vì bốn thứ: sống lâu (nhiều release, codebase còn sửa nhiều tháng sau ra mắt), rộng (nhiều module hay hệ con làm cùng lúc), phụ thuộc (việc này phải xong trước việc kia), và rủi ro (có người dùng thật, regression gây thiệt hại). Astragentic có đúng bốn cơ chế cho bốn thứ đó: tracker và receipt giữ trạng thái ngoài trí nhớ agent, claim và worktree cho nhiều Builder chạy song song, blocking edge và frontier query giữ thứ tự, Rin gate và QA walk chặn trước khi merge. Thiếu cả bốn thì bộ máy này là thừa, một session agent bình thường là đủ."
  fitsLabel: "Hợp khi"
  notYetLabel: "Chưa cần khi"
  fits:
    - "Có roadmap nhiều release; codebase còn sống nhiều tháng sau khi ra mắt."
    - "Nhiều module hay hệ con (app, backend, admin, tích hợp) làm song song."
    - "Việc phụ thuộc nhau, cần thứ tự; có người dùng thật, regression là rủi ro."
  notYet:
    - "Một deliverable, giao xong là xong."
    - "Một người làm tuần tự cũng kịp, không có gì chạy song song."
    - "Không có phụ thuộc giữa các việc, không có release sau."

adopt:
  eyebrow: "Install"
  headline: "Bốn lệnh để đưa đội vào repo của bạn."
  sub: "Kiểm yêu cầu, cài harness vào repo, để Claude Code chạy bản thích nghi, rồi mở session Thomas. Từ đó mọi việc đi qua Thomas."
  reqEyebrow: "Tech stack"
  reqHeadline: "Bảy thứ cần có trước khi cài."
  reqSub: "Bốn bắt buộc, một tuỳ chọn, một chọn một. Script `check-requirements.sh` kiểm tất cả cho bạn trước khi cài."
  reqTitle: "Tech stack cần có"
  requirements:
    - name: "Claude Code CLI"
      tag: "required"
      role: "Runtime chạy các vai. Gate milestone của Rin chỉ chạy trên **Claude**, nên thiếu Claude là không gate được."
      href: "https://docs.anthropic.com/en/docs/claude-code"
    - name: "Codex CLI"
      tag: "optional"
      role: "Vendor thứ hai cho lượt review chéo và runtime dự phòng. Thiếu **Codex**, đội chạy chế độ một provider."
      href: "https://github.com/openai/codex"
    - name: "Git ≥ 2.5, có worktree"
      tag: "required"
      role: "Ranh giới cô lập: mỗi Builder một **checkout riêng**, không ai ghi đè HEAD của ai."
    - name: "herdr ≥ 0.8.0 và herdr skill"
      tag: "required"
      role: "Mỗi agent một **pane**. Thomas nhìn thấy agent nào đang chạy, gửi và chờ tin qua **herdr CLI**."
      href: "https://github.com/herdrdev/herdr"
    - name: "mattpocock-skills ≥ 1.2.3"
      tag: "required"
      role: "**Phương pháp SDLC** mà đội đi theo: grill, spec, tickets, implement, code review."
      href: "https://github.com/mattpocock/skills"
    - name: "Issue tracker: GitHub Issues, Jira hoặc Linear"
      tag: "pick one"
      role: "**Bộ nhớ chung** (shared memory) của đội. Mọi task, claim và receipt đều đi qua đây."
    - name: "python3"
      tag: "required"
      role: "Chạy các **hook gác git** và nạp lại contract sau compaction."
