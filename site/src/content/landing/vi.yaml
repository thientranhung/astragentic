hero:
  headline: "Astragentic là lớp điều phối\ncho nhiều agent trên một repo thật."
  sub: "Một agent chạy một mình thì không cần gì ở đây; cái này dành cho lúc anh em chạy bốn agent cùng lúc."
  primary: "Xem cấu trúc ↓"
  secondary: "Cài cho repo của anh em"

sections:
  structure:
    headline: "Bốn lớp, mỗi lớp một câu hỏi"
    sub: "Runtime chạy agent, harness giữ luật, coordination giữ trạng thái, dưới cùng là repo của anh em."
  roles:
    headline: "Năm vai, năm kiểu session"
    sub: "Vai sống bao lâu quyết định nó nhớ được cái gì, nên mình chia theo tuổi thọ session chứ không theo chức danh."
  lifecycle:
    headline: "Một ticket đi qua bảy chặng"
    sub: "Bảy cái tên có ở đây để khi một thứ hỏng, mình có chỗ treo nó vào."
  tracker:
    headline: "Thomas hỏi tracker, không nhớ tracker"
    sub: "Cái gì sẵn để làm là một câu truy vấn trên board, không phải thứ nằm trong đầu một session."
  skills:
    headline: "Mười sáu skill, xếp theo lúc cần dùng"
    sub: "Mỗi skill một dòng động từ, và một trang nói rõ nó để lại cái gì."
  hooks:
    headline: "Bốn hook đứng gác"
    sub: "Ba cái đang chạy, một cái đang ngủ, và mình để nguyên cái đang ngủ ở đây."
  why:
    headline: "Năm câu vì sao"
    sub: "Mỗi câu kèm cái giá, vì một lựa chọn không có giá thường là lựa chọn chưa được thử."
  stack:
    headline: "Chín thứ mình đứng lên"
    sub: "Món nào bỏ ra mà chỉ hơi bất tiện thì mình bỏ rồi."
  arm:
    headline: "Hai bên soi nhau"
    sub: "Claude build, Codex đọc lại, và biên nhận buộc vào đúng SHA đã được đọc."
  evidence:
    headline: "Bằng chứng, không phải lời hứa"
    sub: "{{meta.cited}} trên {{meta.total}} dòng đã buộc vào một file đang bắt ai đó làm khác đi hôm nay, phần còn lại mình để nguyên trong bảng."
    cta: "Mở cuốn sổ"
  limit:
    headline: "Chỗ mình chưa đo được"
    sub: "Cái vòng này chưa từng chạy trọn một lần trên việc thật, và mình để nguyên khoảng trống đó ở đây."

stages:
  claim: "Ghi assignee, đọc lại, rồi mới tạo branch. Branch là thứ quyết định."
  brief: "Thomas đẩy ticket vào một pane, kèm Base để code-review có ref thật."
  build: "Builder là người viết duy nhất trong worktree, commit ở mỗi ranh giới pha."
  code-review: "Hai trục Standards và Spec, chạy đúng một lượt trên cả increment."
  simplify: "Commit simplify(increment) phải nằm đúng ở head, không có gì đè lên."
  arm: "Builder gọi vendor kia đọc lại diff, để lại biên nhận arm(ticket)."
  merge: "Commit merge trước, gate trên SHA đó, rồi viết lại frontier lên board."

roleCards:
  thomas: "Sống suốt phiên. Giữ tracker, frontier, claim, dispatch và merge."
  shaper: "Một session không đứt: grill, spec, cắt ticket, rồi dừng."
  builder: "Một ticket, một worktree, người viết duy nhất ở đó."
  rin: "Một vòng mỗi milestone, đọc diff và kiểm dấu vết quy trình."
  qa: "Dùng sản phẩm đang chạy như một người dùng, không đọc diff."

hooksCards:
  - id: pre-tool-use
    title: "PreToolUse · git guard"
    when: "Trước mỗi lệnh Bash, trên Claude Code và Codex."
    does: "Từ chối lệnh git nhầm tay kèm câu lệnh đúng để thay, hoặc im lặng. Không bao giờ tự làm gì."
  - id: worktree-remove
    title: "WorktreeRemove · release"
    when: "Khi worktree bị gỡ qua đường tool, mà Thomas thì gỡ bằng git thuần."
    does: "Đáng lẽ reap tiến trình rồi gọi plug của project. Đo được không lần bắn nào, nên dọn tay vẫn bắt buộc."
  - id: session-start
    title: "SessionStart(compact) · contract reload"
    when: "Ngay sau khi một session Claude Code compact."
    does: "Nạp lại đường dẫn contract của vai, tới tay agent trước khi nó kịp hành động."
  - id: subagent-stop
    title: "SubagentStop · log"
    when: "Mỗi lần một subagent kết thúc."
    does: "Ghi agent_type, agent_id, session_id vào log. Chính nó là nhóm đối chứng chứng minh hook trên đang ngủ."

whyCards:
  - slug: why-astragentic
    question: "Vì sao phải thêm một lớp nữa?"
    oneLine: "Một agent thì không cần. Con thứ hai và thứ ba mới là lúc việc biến mất mà không lỗi nào được ném ra."
  - slug: why-mattpocock
    question: "Vì sao thuê method của mattpocock?"
    oneLine: "Anh ấy loop ở đầu, mình đã loop ở đuôi và trả giá bằng 5 tới 14 vòng review cho một ticket."
  - slug: why-not-subagents
    question: "Vì sao không chỉ dùng subagent?"
    oneLine: "Chung checkout, chung context, không có tracker làm state, không có pane để nhìn, không có hãng thứ hai."
  - slug: why-tracker
    question: "Vì sao trạng thái phải nằm trên tracker?"
    oneLine: "Một file plan không trả lời được câu ticket nào đang sẵn sàng ngay bây giờ; một truy vấn thì trả lời được."
  - slug: why-cross-vendor
    question: "Vì sao cần model hãng khác đọc lại?"
    oneLine: "Vòng cùng hãng đã cho lọt một defect đem secret và PII vào file được track; vòng cross-vendor bắt được ở mức P1."

stackItems:
  - slug: claude-code
    name: "Claude Code"
    oneLine: "Runtime gốc: cả năm vai chạy được ở đây, và hai hook quan trọng nhất sống ở đây."
  - slug: codex
    name: "Codex"
    oneLine: "Hãng thứ hai. Không có nó thì cross-vendor arm không tồn tại."
  - slug: opencode
    name: "OpenCode"
    oneLine: "Runtime thứ ba cho dispatch vai, và là chỗ git guard không với tới."
  - slug: git-worktree
    name: "git worktree"
    oneLine: "Ranh giới isolation thật: một checkout cho một ticket, một người ghi duy nhất."
  - slug: herdr
    name: "herdr"
    oneLine: "Mỗi agent một pane mở ra nhìn được, nên dispatch thành thứ đếm được thay vì thứ được kể lại."
  - slug: mattpocock-skills
    name: "mattpocock-skills"
    oneLine: "Toàn bộ phần craft thuê từ đây; Astragentic không viết method riêng."
  - slug: trackers
    name: "GitHub · Jira · Linear"
    oneLine: "Ba adapter cho một tracker contract, để anh em dùng tiếp cái board đang có."
  - slug: scripts
    name: "Python · Bash"
    oneLine: "Mỗi script phải có một khoảnh khắc và một người sở hữu; thiếu một trong hai là script không ai chạy."
  - slug: archify
    name: "archify"
    oneLine: "Diagram tả bằng JSON rồi render ra HTML và SVG, nên bản Việt và bản Anh không lệch nhau."
