features:
  - id: cross-vendor
    title: "Review ba lens, cộng một AI của hãng khác."
    body: "Mọi ticket full đi qua astra-review với ba lens song song (correctness, intent, standards) trên Claude Code, rồi một lệnh codex exec chỉ đọc. Đo blind trên 7 ticket replay, Codex tìm 21 defect thật mỗi lượt với precision 0.77. Hết quota thì arm ghi NOT RUN và Opus đọc thay, không bao giờ tính là pass."
    diagram: cross-vendor-arm
    crop: [builder, codex, head]
    href: /vi/review/
  - id: tracker
    title: "Vận hành liên tục quanh issue tracker."
    body: "Mọi yêu cầu, spec và ticket đều nằm trên tracker. Review phát hiện việc mới thì ghi thành ticket mới. Team chạy 24/7 mà không cần bạn ngồi canh, và không có việc nào rơi ra ngoài hệ thống."
    diagram: frontier-query
    crop: [frontier_query, board]
    href: /vi/cau-truc/#coordination
  - id: roles
    title: "Team có tên, có role, có contract."
    body: "Thomas đại diện, BA làm rõ vấn đề, Shaper định hình, Builder thi công, QA nghiệm thu, Quick Builder làm việc nhỏ. Mỗi role có contract và system context riêng, nên trách nhiệm rõ và không ai làm thay việc của ai."
    diagram: six-roles
    crop: [shaper, builder]
    href: /vi/role/thomas/
  - id: runtime
    title: "Hai runtime, hai host, dùng trọn Claude Code."
    body: "Claude Code là runtime tham chiếu: custom agent, skill, hook, subagent, mod và advisor đều được dùng. Codex là runtime thứ hai và là hãng đọc lại. Agent chạy trong pane của Herdr hoặc Orca. Model và effort của từng role khai trong orchestrator.md."
    diagram: structure
    crop: [runtime_claude, runtime_codex]
    href: /vi/tech-stack/#claude-code
  - id: models
    title: "Đúng model cho đúng việc."
    body: "Mỗi role một dòng model và effort trong orchestrator.md. Lens adversarial chạy trên Opus vì đo được: Opus tìm 13 defect thật, Sonnet tìm 7 trên cùng bảy ticket. Chi phí và chất lượng cân theo từng role thay vì một model cho tất cả."
    href: /vi/role/builder/
  - id: oversight
    title: "Toàn quyền giám sát, không cần ra tay."
    body: "Board tracker, pane trên Herdr hoặc Orca, thiết kế và quyết định đều đọc lại được. Thomas hỏi lại bạn ở những điểm quan trọng: UI/UX, lựa chọn tech stack. Bạn quyết, team làm."
    diagram: client-studio
    href: /vi/role/thomas/

fit:
  eyebrow: "Quy mô phù hợp"
  headline: "Dành cho dự án dài hơi, nhiều phần, chạy song song."
  body: "Một dự án lớn không lớn vì có sprint hay story. Nó lớn vì sống lâu, rộng, có phụ thuộc và có rủi ro, và Astragentic có đúng một cơ chế cho mỗi thứ: tracker và receipt giữ trạng thái ngoài trí nhớ agent, claim và worktree cho nhiều Builder chạy song song, blocking edge và frontier query giữ thứ tự, review ba lens, arm, QA walk và slice gate chặn trước khi merge. Thiếu cả bốn thì một session agent bình thường là đủ."
  fitsLabel: "Hợp khi"
  notYetLabel: "Chưa cần khi"
  fits:
    - "Có roadmap nhiều release; codebase còn được sửa nhiều tháng sau khi ra mắt."
    - "Nhiều module hay hệ con (app, backend, admin, tích hợp) làm song song."
    - "Việc phụ thuộc nhau, cần thứ tự; có người dùng thật, regression là rủi ro."
  notYet:
    - "Một deliverable, giao xong là xong."
    - "Một người làm tuần tự cũng kịp, không có gì chạy song song."
    - "Không có phụ thuộc giữa các việc, không có release sau."

adopt:
  eyebrow: "Install"
  headline: "Bốn bước để đưa team vào repo của bạn."
  sub: "Astragentic cài theo từng dự án, không cài vào máy. Mỗi bản release là một tag trên GitHub; dự án tự kiểm và tự nâng cấp bằng chính script đi kèm."
  steps:
    - title: "Stage bản release mới nhất vào dự án"
      note: "Chạy ở gốc repo. Lệnh chỉ chép bản release vào `.astraler/releases/<version>/`, không ghi file nào của bạn. Ghim bản bằng `| bash -s -- 6.1.19`."
