hero:
  eyebrow: "Autonomous coding · **cho dự án nhiều milestone** · v{{meta.version}}"
  headline: "Một team outsource bằng AI agent.\nVận hành đúng quy trình, **liên tục 24/7**, cho **những dự án lớn**."
  sub: "Astragentic là scaffold để vận hành một team AI agent theo mô hình orchestrator. Bạn trao đổi với một người đại diện, team thi công theo role, và mọi việc đi qua issue tracker: GitHub Issues, Jira hoặc Linear. Những phần khó của việc điều hành nhiều agent đã được giải quyết sẵn; phần còn lại là của bạn."
  primary: "Khám phá cách hoạt động ↓"
  secondary: "Đọc cách tiếp cận của Astragentic"

explain:
  runtimes:
    commands:
      label: "Mở agent qua CLI trên ba runtime"
      lines:
        - "claude   --dangerously-skip-permissions --agent builder --model <model> --effort <low|medium|high|xhigh|max>"
        - "codex    --profile builder            # model + model_reasoning_effort nằm trong profile TOML"
        - "opencode --agent builder -m <provider>/<model>   # không có cờ effort"

  customize:
    eyebrow: "Tuỳ biến"
    headline: "Mỗi người một cách làm việc với AI. Astragentic là bộ khung cho người theo trường phái agent orchestration."
    paragraphs:
      - "Không có một cách làm việc với AI đúng cho tất cả. Astragentic không chọn thay bạn."
    bullets:
      - "**Đủ vòng SDLC**: năm role, gate ở mỗi milestone, QA walk trước khi merge."
      - "**Tối giản**: hai agent, một người đại diện và một người thi công."
      - "**Theo hạ tầng của bạn**: đổi tracker, đổi runtime, thêm một bước review riêng."
    paragraphsAfter:
      - "Tuỳ biến là sửa file trong bản checkout của bạn. Mỗi role là một contract, mỗi skill là một thư mục, mỗi hook là một script."
      - "Đường đưa thay đổi tới dự án là đường phát hành: tăng `VERSION`, ghi một mục trong `RELEASE-NOTES.md`, rồi cài lại bằng `install.sh`. Bước thích nghi trong dự án so bản mới với bản đang chạy và giữ nguyên các file thuộc về bạn, như `orchestrator.md`."

  comms:
    eyebrow: "Giao tiếp giữa các agent"
    headline: "Dispatch một ticket là mở một cuộc trao đổi có địa chỉ."
    paragraphs:
      - "Ticket là một issue trên tracker, cắt đủ nhỏ để một Builder hoàn thành trong một session. Nó mang một id ổn định, một trạng thái, một assignee, và các blocking edge tới việc phải xong trước."
      - "Thomas dispatch theo skill `dispatch-ticket`: claim trên tracker, tạo branch và worktree, mở pane herdr, launch agent theo role, gửi brief, đặt watcher. Chuỗi ticket → assignee → pane → worktree → branch → PR là một-một, nên nhiều Builder chạy song song mà không giẫm lên nhau."
      - "Giữa các session Claude Code, kênh chính là cross-session messaging có sẵn. Mỗi session có một tên; Thomas tra tên bằng ListAgents rồi gửi thẳng. Ở đầu nhận, thông điệp hiện thành dòng preview `› Message from @thomas: …`, mở rộng bằng ctrl+o, và câu trả lời đi ngược về đúng session đã gửi."
      - "herdr là mặt phẳng nhìn thấy và là đường dự phòng: mỗi agent một pane có tên, watcher báo working, blocked, idle. Thomas đọc pane bằng `herdr agent read` khi một session im lặng, và điều Builder trên Codex hay OpenCode qua herdr CLI."
    bullets:
      - "**Câu hỏi kỹ thuật**: Thomas trả lời thay bạn, từ contract, spec và tracker."
      - "**Quyết định thiết kế**: đi lên bạn qua `to-questionnaire`, dưới dạng câu hỏi trả lời được."
      - "**Vị trí của bạn**: đứng trên vòng lặp, không đứng trong từng bước của nó."
  roles:
    eyebrow: "AI outsource team"
    headline: "Công việc của mỗi agent."
    paragraphs:
      - "Mỗi thành viên trong team là một agent: một session **Claude Code**, **Codex** hoặc **OpenCode** mở từ CLI với một role cố định. Nó nhận việc, làm xong thì trả kết quả, và có thể nhân bản: nhiều Builder cùng thi công, nhiều QA cùng kiểm, như một team thật."
      - "Mỗi role có một tên riêng: Thomas, Shaper, Builder, Rin, QA. Tên riêng giữ agent không trôi khỏi role của mình trong context dài, và là địa chỉ để gửi việc, đọc pane, gắn đúng skill."
    figureNote: "Thomas quản trị cả team: nhận yêu cầu từ bạn, gọi Shaper khi cần spec, dispatch ticket cho Builder, gọi Rin gate ở mỗi milestone và QA walk trước khi merge, rồi báo lại bạn. Mỗi mũi tên trên hình là một lượt trao đổi đi và về."
    models:
      label: "Model và effort theo role"
      intro: "Agent của mỗi role chạy trên model và effort hợp với việc của role đó. Thomas và Shaper suy luận dài nên dùng Opus, Shaper ở effort high. Builder và QA cần nhanh và rẻ nên dùng Sonnet. Rin gate trên Opus ở effort medium."
      note: "Bảng này đọc thẳng từ `.agents/orchestrator.md` trong repo của bạn. Đổi một dòng là đổi runtime, model hay effort của role đó ở lần dispatch kế tiếp, không cần sửa contract của role."
    items:
      - id: thomas
        title: "Thomas"
        tag: "người đại diện"
        session: "Session thường trực, kéo dài qua nhiều ticket."
        body: "Giữ tracker, chạy frontier query, claim, dispatch và merge. Là agent duy nhất còn ở đó khi Builder đã đóng session, nên mọi trạng thái bền đều thuộc Thomas. Hỏi lại bạn ở những quyết định quan trọng."
        href: "/vi/role/thomas/"
      - id: shaper
        title: "Shaper"
        tag: "định hình"
        session: "Một session liền mạch từ đầu tới cuối, không compact."
        body: "Chạy grill-with-docs, to-spec, to-tickets theo thứ tự, dừng sau spec để bạn duyệt."
        href: "/vi/role/shaper/"
      - id: builder
        title: "Builder"
        tag: "thi công"
        session: "Một session mỗi ticket, trong worktree riêng, là người viết duy nhất ở đó."
        body: "Implement, code review hai trục, simplify, rồi lượt review chéo do Codex đọc lại. Commit ở mỗi ranh giới, không chỉ lúc handback."
        href: "/vi/role/builder/"
      - id: rin
        title: "Rin"
        tag: "gate"
        session: "Một session mỗi milestone, worktree tách riêng tại đúng SHA được review."
        body: "Chỉ đọc và viết đúng một file: báo cáo gate. Một vòng mỗi milestone, không lặp."
        href: "/vi/role/rin/"
      - id: qa
        title: "QA"
        tag: "nghiệm thu"
        session: "Một session mỗi lượt walk, với sản phẩm đang chạy thật trong worktree riêng."
        body: "Dùng sản phẩm như người dùng, không đọc diff. Mặc định chỉ đọc, mọi thao tác ghi cần bạn cho phép từng lần."
        href: "/vi/role/qa/"

  tracker:
    eyebrow: "Issue tracker"
    headline: "Mọi việc đi qua tracker, nên không việc nào lạc hướng."
    paragraphs:
      - "Trạng thái công việc được lưu trên tracker, không trong chat hay trí nhớ của một agent. Thomas hỏi tracker cái gì đã sẵn sàng; bạn mở board là đọc được."
    bullets:
      - "**Ticket là dữ liệu**: id, status, assignee, blocking edge, đọc và ghi qua API. Không còn ô tick trong file markdown mà agent phải nhớ sửa."
      - "**Claim là một dòng assignee** ghi và đọc lại được, nên nhiều Builder chạy song song."
      - "**Một ticket là một branch, một worktree, một PR**, cùng mã ticket trong tên. Merge xong thì ticket đóng, worktree dọn."
      - "**Ticket giữ cả câu chuyện**: nội dung việc, cách làm, câu hỏi đã hỏi, receipt đã commit. Bạn hiểu một việc bằng cách mở ticket."
      - "**Không có công cụ mới phải học**: GitHub Issues, Jira, Linear đều dùng được."
    items:
      - text: "A stable ticket id in the TITLE"
      - text: "A status with five states — Backlog / Todo / In Progress / Done / Won't fix"
      - text: "An assignee, written and read back atomically"
      - text: "Every precondition as a queryable EDGE"
      - text: "A surface the OWNER can open and read without running a query"
    more:
      label: "Khám phá cấu trúc →"
      href: "/vi/cau-truc/#coordination"

  method:
    eyebrow: "mattpocock-skills"
    headline: "Astragentic chọn mattpocock-skills làm khung quản trị và phát triển dự án."
    paragraphs:
      - "Bộ skill của Matt Pocock bao trọn hai nửa của một dự án, và Astragentic gắn từng skill vào đúng role."
    bullets:
      - "**Nửa quản trị**: wayfinder định hướng, triage phân loại việc, grill hỏi cho ra yêu cầu, to-spec chốt spec, to-tickets cắt thành ticket."
      - "**Nửa phát triển**: implement theo TDD, code-review, simplify, diagnosing-bugs."
      - "**Một khung cho cả hai**: Thomas quản trị và Builder thi công theo cùng một phương pháp, từ yêu cầu đầu tiên tới PR cuối cùng."
    items:
      - id: thomas
        title: "Thomas"
        text: "triage · wayfinder · to-questionnaire · ask-matt"
      - id: shaper
        title: "Shaper"
        text: "grill-with-docs → to-spec → to-tickets"
      - id: builder
        title: "Builder"
        text: "implement"
      - title: "Dùng chung"
        text: "grilling · tdd · code-review · codebase-design · domain-modeling · research · prototype · diagnosing-bugs"
    more:
      label: "Hiểu rõ hơn lý do chọn →"
      href: "/vi/cach-tiep-can/#why-mattpocock"

why:
  eyebrow: "Cách tiếp cận"
  headline: "AI đã là một developer thực thụ. Astragentic đặt bạn vào vị trí người dẫn dắt team developer đó."
  p1: "Coding agent hôm nay nhận việc, viết code, chạy test và sửa cho tới khi xanh. Khi thực thi không còn là nút thắt, giá trị của người kỹ sư chuyển sang chỗ khác: đặt yêu cầu đúng, quyết định đúng, giữ quy trình đi đúng hướng."
  p2: "Astragentic được xây để bạn làm đúng phần đó. Nó tổ chức các agent thành một team outsource theo kỷ luật SDLC quen thuộc, và thiết kế lại cách dispatch, review, handback để khai thác tốc độ mà một team người không duy trì được."
  more: "Khám phá toàn bộ cách tiếp cận →"

shots:
  hero:
    caption: "Một phiên làm việc với Astragentic: mở herdr, gọi Thomas, hỏi tiến độ. Thomas đọc board GitHub Issues, tìm ra ba ticket không giao nhau, mở ba Builder chạy song song trên ba worktree, tự trả lời câu hỏi kỹ thuật, đóng từng ticket khi xong, rồi gửi bạn báo cáo ngắn."
    video:
      mp4: /shots/hero.mp4
      webm: /shots/hero.webm
      poster: /shots/hero.jpg
  sendmessage:
    caption: "Một lượt dispatch TRA-142: bạn nói với Thomas, Thomas gọi Builder theo tên session bằng cross-session messaging, tự trả lời câu hỏi kỹ thuật, và đưa quyết định UX về cho bạn."
    video:
      mp4: /shots/dispatch.mp4
      webm: /shots/dispatch.webm
      poster: /shots/dispatch.jpg
  herdr:
    caption: "Workspace herdr của một dự án: mỗi agent một pane có tên và trạng thái, bạn bấm là đọc được, Thomas đọc và nhắn qua CLI, kể cả Builder chạy Codex."
    video:
      mp4: /shots/herdr.mp4
      webm: /shots/herdr.webm
      poster: /shots/herdr.jpg
  tracker:
    caption: "Ba tracker, một cách làm việc: GitHub Issues, Jira và Linear đều có adapter riêng trong harness, Thomas nạp đúng adapter ở đầu session."
    deck:
      - name: Linear
        adapter: linear-issue-tracker
        src: /shots/tracker-linear.jpg
      - name: GitHub Issues
        adapter: github-issue-tracker
        src: /shots/tracker-github.jpg
      - name: Jira
        adapter: jira-issue-tracker
        src: /shots/tracker-jira.jpg

features:
  - id: cross-vendor
    title: "Review gate hai lớp, hai AI của hai hãng."
    body: "Mọi ticket đi qua code-review theo Standards và Spec trên Claude Code, rồi một lượt đọc chéo trên Codex. Hai model của hai hãng, Claude và Codex, đọc cùng một diff trước khi merge, nên chất lượng không phụ thuộc vào một model duy nhất."
    diagram: cross-vendor-arm
    crop: [builder, codex, head]
    href: /vi/skills/codex-arm/
  - id: tracker
    title: "Vận hành liên tục quanh issue tracker."
    body: "Mọi yêu cầu, spec và ticket đều nằm trên tracker. Review phát hiện việc mới thì ghi thành ticket mới. Team chạy 24/7 mà không cần bạn ngồi canh, và không có việc nào rơi ra ngoài hệ thống."
    diagram: frontier-query
    crop: [frontier_query, board]
    href: /vi/cau-truc/#coordination
  - id: roles
    title: "Team có tên, có role, có contract."
    body: "Thomas đại diện, Shaper định hình, Builder thi công, Rin giữ gate, QA nghiệm thu. Mỗi role có contract và system context riêng, nên trách nhiệm rõ và không ai làm thay việc của ai. Claude Code, Codex và OpenCode đều hỗ trợ agent profile ở mức này."
    diagram: five-roles
    crop: [shaper, builder]
    href: /vi/role/thomas/
  - id: runtime
    title: "Một quy trình, nhiều runtime."
    body: "Claude Code là nền bắt buộc; Codex và OpenCode thêm vào khi bạn cần AI của hãng thứ hai hay model khác. Role nào chạy trên runtime nào khai trong orchestrator.md; đổi runtime không đổi quy trình."
    diagram: structure
    crop: [runtime_claude, runtime_codex]
    href: /vi/tech-stack/#claude-code
  - id: models
    title: "Đúng model cho đúng việc."
    body: "Sonnet cho Builder và QA, nơi cần nhanh và rẻ; Opus cho Thomas, Shaper và Rin, nơi cần suy luận dài. Chi phí và chất lượng cân theo từng role thay vì một model cho tất cả."
    href: /vi/role/builder/
  - id: oversight
    title: "Toàn quyền giám sát, không cần ra tay."
    body: "Board tracker, pane herdr, thiết kế và quyết định đều đọc lại được. Thomas hỏi lại bạn ở những điểm quan trọng: UI/UX, lựa chọn tech stack. Bạn quyết, team làm."
    diagram: hub-and-spokes
    crop: [tra139, tra142]
    href: /vi/role/thomas/

fit:
  eyebrow: "Quy mô phù hợp"
  headline: "Dành cho dự án dài hơi, nhiều phần, chạy song song."
  body: "Một dự án lớn không lớn vì có sprint hay story. Nó lớn vì sống lâu, rộng, có phụ thuộc và có rủi ro, và Astragentic có đúng một cơ chế cho mỗi thứ: tracker và receipt giữ trạng thái ngoài trí nhớ agent, claim và worktree cho nhiều Builder chạy song song, blocking edge và frontier query giữ thứ tự, Rin gate và QA walk chặn trước khi merge. Thiếu cả bốn thì một session agent bình thường là đủ."
  fitsLabel: "Hợp khi"
  notYetLabel: "Chưa cần khi"
  fits:
    - "Có roadmap nhiều release; codebase còn được sửa nhiều tháng sau khi ra mắt."
    - "Nhiều module hay hệ con (app, backend, admin, tích hợp) làm song song."
    - "Việc phụ thuộc nhau, cần thứ tự; có người dùng thật, regression là rủi ro."
  notYet:
    - "Một deliverable, giao xong là xong."
    - "Một người làm tuần tự cũng kịp, không có gì chạy song song."
    - "Không có phụ thuộc giữa các việc, không có release sau."

adopt:
  eyebrow: "Install"
  headline: "Năm bước để đưa team vào repo của bạn."
  sub: "Astragentic cài từ bản checkout của bạn vào từng thư mục dự án, không cài vào máy. Một bản phục vụ nhiều dự án, và mọi tuỳ biến đi tới các dự án bằng đúng đường cài đặt này."
  steps:
    - title: "Kiểm máy có đủ tech stack chưa"
      lines: ["./check-requirements.sh"]
    - title: "Cài harness vào repo của bạn"
      note: "Chạy từ thư mục **Astragentic**, trỏ tới thư mục dự án. Lệnh chỉ chép một bản release vào `.astraler/releases/` của dự án đó, không sửa file nào của bạn. Một bản Astragentic cài được cho nhiều dự án; bạn chỉnh và nâng cấp harness ở một chỗ rồi cài lại cho từng dự án."
      lines: ["./install.sh /path/to/your-repo"]
    - title: "Để Claude Code thích nghi harness với repo"
      note: "Đọc và thực thi ADAPT-HARNESS.md: đặt tên tracker, prefix ticket, đường dẫn docs."
      lines: ["cd /path/to/your-repo", "claude \"Read .astraler/releases/2.8.0/ADAPT-HARNESS.md completely and execute it.\""]
    - title: "Cấu hình mattpocock-skills cho repo, chạy một lần"
      note: "Skill này khai tracker, bộ nhãn triage và chỗ để CONTEXT.md, ADR; các skill engineering sau đó đọc cấu hình này."
      lines: ["claude", "/mattpocock-skills:setup-matt-pocock-skills"]
    - title: "Mở session Thomas"
      note: "Thomas chạy không hỏi quyền từng lệnh để điều phối liên tục; model và effort theo dòng thomas trong orchestrator.md."
      lines: ["claude --dangerously-skip-permissions --agent thomas --model claude-opus-5 --effort medium"]
  reqEyebrow: "Tech stack"
  reqHeadline: "Bảy thứ cần có trước khi cài."
  reqSub: "Năm thứ bắt buộc, một tuỳ chọn, một chọn một trong ba. Script `check-requirements.sh` kiểm tất cả cho bạn trước khi cài."
  reqTitle: "Tech stack cần có"
  requirements:
    - name: "Claude Code CLI"
      tag: "required"
      role: "Runtime chạy các agent. Gate milestone của Rin chỉ chạy trên **Claude**, nên thiếu Claude là không gate được."
      href: "https://docs.anthropic.com/en/docs/claude-code"
    - name: "Codex CLI"
      tag: "optional"
      role: "AI của hãng thứ hai (OpenAI) cho lượt review chéo, và là runtime dự phòng. Thiếu **Codex**, team chạy chế độ một provider."
      href: "https://github.com/openai/codex"
    - name: "Git ≥ 2.5, có worktree"
      tag: "required"
      role: "Ranh giới cô lập: mỗi Builder một **checkout riêng**, không ai ghi đè HEAD của ai."
    - name: "herdr ≥ 0.8.0 và herdr skill"
      tag: "required"
      role: "Mỗi agent một **pane**. Thomas nhìn thấy agent nào đang chạy, gửi và chờ tin qua **herdr CLI**."
      href: "https://github.com/herdrdev/herdr"
    - name: "mattpocock-skills ≥ 1.2.3"
      tag: "required"
      role: "**Phương pháp SDLC** mà team đi theo: grill, spec, tickets, implement, code review."
      href: "https://github.com/mattpocock/skills"
