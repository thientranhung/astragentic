features:
  - id: cross-vendor
    title: "Review gate hai lớp, hai vendor."
    body: "Mọi ticket đi qua review built-in của Claude Code, rồi qua một lượt đọc chéo của Codex. Hai model soi cùng một diff, tranh luận trước khi merge. Chất lượng không phụ thuộc vào việc Builder hôm nay giỏi hay kém."
    diagram: cross-vendor-arm
    crop: [builder, codex, head]
    href: /skills/codex-arm
  - id: tracker
    title: "Vận hành liên tục quanh issue tracker."
    body: "Mọi phân tích, slice và task đều nằm trên tracker. Review phát hiện việc mới thì tự nạp vào hàng đợi. Đội chạy 24/7 mà không cần bạn ngồi canh, và không có việc nào rơi ra ngoài hệ thống."
    diagram: frontier-query
    crop: [frontier_query, board]
    href: /cau-truc#coordination
  - id: roles
    title: "Đội có tên, có vai, có hợp đồng."
    body: "Thomas đại diện, Shaper định hình, Builder thi công, Rin giữ gate, QA nghiệm thu. Mỗi vai có system context riêng, nên trách nhiệm rõ và không ai làm thay việc của ai. Claude Code và Codex đều hỗ trợ agent profile ở mức này."
    diagram: five-roles
    crop: [shaper, builder]
    href: /vai/thomas
  - id: runtime
    title: "Không lệ thuộc runtime."
    body: "Chỉ có Codex, chỉ có Claude Code, hay cả hai đều vận hành được. Bạn khai báo vai nào chạy trên provider nào trong orchestrator.md; đổi provider không đổi quy trình."
    diagram: structure
    crop: [runtime_claude, runtime_codex]
    href: /tech-stack#claude-code
  - id: models
    title: "Đúng model cho đúng việc."
    body: "Sonnet cho Builder thi công nhanh, Opus cho phân tích và slice cần suy luận sâu. Chi phí và chất lượng được cân theo từng vai thay vì một model cho tất cả."
    href: /vai/builder
  - id: oversight
    title: "Toàn quyền giám sát, không cần ra tay."
    body: "Board tracker, pane herdr, thiết kế và quyết định đều đọc lại được. Thomas hỏi lại bạn ở những điểm quan trọng: UI/UX, lựa chọn tech stack. Bạn quyết, đội làm."
    diagram: hub-and-spokes
    crop: [tra139, tra142]
    href: /vai/thomas

fit:
  headline: "Sinh ra cho dự án nhiều story, nhiều milestone."
  body: "Astragentic không dành cho một script hay một prototype cuối tuần. Nó phát huy khi backlog dài, milestone nối tiếp, và bạn cần một đội chạy ổn định trong nhiều tuần. Nếu dự án của bạn ở quy mô đó, phần còn lại của site là dành cho bạn."
  fitsLabel: "Hợp khi"
  notYetLabel: "Chưa hợp khi"
  fits:
    - "Backlog dài, nhiều story còn chờ tới lượt."
    - "Milestone nối tiếp nhau qua nhiều tuần."
    - "Bạn cần một đội chạy ổn định, không phải một lượt chạy."
  notYet:
    - "Một script chạy một lần rồi thôi."
    - "Một prototype dựng trong cuối tuần."
    - "Một thay đổi nhỏ, xong trong đúng một session."

adopt:
  headline: "Install"
  reqHeadline: "Tech stack cần có"
  reqTitle: "Tech stack cần có"
  requirements:
    - name: "Claude Code CLI"
      tag: "required"
      role: "Runtime chạy các vai. Gate milestone của Rin chỉ chạy trên **Claude**, nên thiếu Claude là không gate được."
      href: "https://docs.anthropic.com/en/docs/claude-code"
    - name: "Codex CLI"
      tag: "optional"
      role: "Vendor thứ hai cho lượt review chéo và runtime dự phòng. Thiếu **Codex**, đội chạy chế độ một provider."
      href: "https://github.com/openai/codex"
    - name: "Git ≥ 2.5, có worktree"
      tag: "required"
      role: "Ranh giới cô lập: mỗi Builder một **checkout riêng**, không ai ghi đè HEAD của ai."
    - name: "herdr ≥ 0.8.0 và herdr skill"
      tag: "required"
      role: "Mỗi agent một **pane**. Thomas nhìn thấy agent nào đang chạy, gửi và chờ tin qua **herdr CLI**."
      href: "https://github.com/herdrdev/herdr"
    - name: "mattpocock-skills ≥ 1.2.3"
      tag: "required"
      role: "**Phương pháp SDLC** mà đội đi theo: grill, spec, tickets, implement, code review."
      href: "https://github.com/mattpocock/skills"
    - name: "Issue tracker: GitHub Issues, Jira hoặc Linear"
      tag: "pick one"
      role: "**Bộ nhớ chung** (shared memory) của đội. Mọi task, claim và receipt đều đi qua đây."
    - name: "python3"
      tag: "required"
      role: "Chạy các **hook gác git** và nạp lại contract sau compaction."
