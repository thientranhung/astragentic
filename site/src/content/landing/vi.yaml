hero:
  eyebrow: "Agentic engineering · **cho dự án nhiều milestone** · v{{meta.version}}"
  headline: "Một đội outsource bằng AI agent.\nVận hành đúng quy trình, **liên tục 24/7**, cho **những dự án lớn**."
  sub: "Astragentic đưa bạn vào vị trí khách hàng của một đơn vị phát triển phần mềm hoàn chỉnh: một người đại diện để trao đổi, một đội agent có vai trò rõ ràng để thi công, và một issue tracker làm trung tâm để mọi việc đều có dấu vết. Bạn giữ quyền quyết định và toàn quyền giám sát; phần thực thi thuộc về đội."
  primary: "Xem đội vận hành ↓"
  secondary: "Deploy vào repo"

explain:
  agents:
    eyebrow: "Agent trong Astragentic"
    headline: "Một agent là một session coding-agent được giao một vai."
    paragraphs:
      - "Mỗi agent là một session của Claude Code, Codex hoặc OpenCode, launch từ CLI với một vai xác định. Nó nhận nhiệm vụ như một nhân viên, làm xong thì trả kết quả, và có thể nhân bản thành nhiều session chạy song song: nhiều Builder cùng thi công, nhiều QA cùng kiểm, giống một đội thật."
      - "Mỗi vai mang tên người: Thomas, Shaper, Builder, Rin, QA. Tên riêng giữ cho vai không bị trôi trong context dài, và giúp các skill gắn theo vai được kích hoạt đúng."
      - "Vai được định nghĩa bằng một file khai báo theo chuẩn của từng runtime, nạp vào system prompt khi session mở: Claude Code đọc `.claude/agents/<vai>.md`, Codex đọc launch profile `.codex/profiles/<vai>.config.toml`, OpenCode đọc `.opencode/agents/<vai>.md`. Runtime, model và effort của từng vai khai ở một chỗ, `orchestrator.md`."
    commands:
      label: "Start agent qua CLI trên ba runtime"
      lines:
        - "claude   --agent builder --model <model> --effort <low|medium|high|xhigh|max>"
        - "codex    --profile builder            # model + model_reasoning_effort nằm trong profile TOML"
        - "opencode --agent builder -m <provider>/<model>   # không có cờ effort"
    more:
      label: "Xem năm vai →"
      href: "/vai/thomas"

  comms:
    eyebrow: "Cách các agent nói chuyện"
    headline: "Dispatch một ticket là mở một cuộc trao đổi có địa chỉ."
    paragraphs:
      - "Ticket là một issue trên tracker: một **task**, một **feature** hay một **requirement** đã được cắt đủ nhỏ để một Builder hoàn thành trong một session. Mỗi ticket mang một id ổn định trong tiêu đề, một trạng thái, một assignee, và các blocking edge tới việc phải xong trước. Shaper tạo ticket từ spec bằng skill `to-tickets`; Thomas chỉ dispatch những ticket đã sẵn sàng."
      - "Thomas dispatch theo skill `dispatch-ticket`: claim ticket trên tracker trước, tạo branch và worktree, mở một pane herdr, launch vai theo runtime đã khai, gửi brief, và lập tức đặt watcher. Chuỗi ticket → assignee → pane → worktree → branch → PR là một-một, nên nhiều Builder làm song song mà không giẫm lên nhau."
      - "Khi các vai cùng chạy Claude Code, kênh chính là cross-session messaging có sẵn của Claude Code. Mỗi session Claude Code có một tên; Thomas tra tên session của Builder bằng ListAgents rồi gửi cho đúng tên đó. Ở session nhận, thông điệp hiện thành một dòng preview `› Message from @thomas: …`, mở rộng bằng ctrl+o, và câu trả lời đi ngược về đúng session đã gửi. Builder bị chặn thì hỏi; Thomas đọc câu hỏi, trả lời qua đúng kênh đó, rồi đặt Monitor mới chờ tín hiệu làm xong. Nhờ vậy vòng dispatch, hỏi, đáp, handback chạy liền mạch mà không cần người ngồi canh."
      - "herdr là mặt phẳng nhìn thấy và là đường dự phòng. Mỗi vai một pane có tên, Thomas đọc pane bằng `herdr agent read` khi một session im lặng, và dùng herdr CLI để điều Builder trên Codex hay OpenCode, nơi SendMessage không có. Watcher theo dõi trạng thái working, blocked, idle của từng pane."
      - "Phân loại câu hỏi là điều đưa bạn từ human-in-the-loop sang human-on-the-loop. Câu hỏi kỹ thuật thường gặp, Thomas trả lời thay bạn từ contract, spec và tracker. Chỉ quyết định thiết kế thật sự mới đi lên bạn qua `to-questionnaire`, dưới dạng câu hỏi trả lời được. Bạn không đứng trong vòng lặp ở từng bước; bạn đứng trên vòng lặp và can thiệp khi có việc cần bạn."
    commands:
      - label: "Trả lời một Builder bị chặn, cùng Claude Code"
        lines:
          - "ListAgents                                  # Thomas tra tên session của Builder"
          - "@builder-TRA-142 <câu trả lời>              # gửi theo đúng tên đó"
          - "› Message from @thomas: <câu trả lời> (ctrl+o to expand)   # phía Builder nhìn thấy"
          - "Monitor(...)   # Thomas chờ tín hiệu làm xong hoặc cần trao đổi"
      - label: "Điều một Builder trên Codex qua herdr"
        lines:
          - 'herdr agent start "builder-TRA-142" --kind codex --pane <id> -- codex --profile builder'
          - 'herdr agent prompt <pane-id> "<brief>"'
          - "herdr agent read   <pane-id>"
    more:
      label: "Xem skill dispatch-ticket →"
      href: "/skills/dispatch-ticket"

  roles:
    eyebrow: "Chức năng và nhiệm vụ"
    headline: "Năm vai, năm vòng đời session."
    models:
      label: "Model và effort theo vai"
      intro: "Mỗi vai chạy trên model và effort hợp với việc của nó. Thomas và Shaper suy luận dài nên dùng Opus, Shaper ở effort high vì grill và spec là chỗ tốn suy nghĩ nhất; Builder và QA thi công và kiểm thử nên dùng Sonnet cho nhanh và rẻ; Rin gate trên Opus ở effort medium."
      note: "Bảng này đọc thẳng từ `.agents/orchestrator.md` trong repo của bạn. Đổi một dòng là đổi runtime, model hay effort của vai đó ở lần dispatch kế tiếp, không cần sửa contract của vai."
    items:
      - id: thomas
        title: "Thomas"
        tag: "người đại diện"
        session: "Session thường trực, sống qua nhiều ticket."
        body: "Giữ tracker, chạy frontier query, claim, dispatch và merge. Là vai duy nhất còn ở đó khi Builder đã đóng session, nên mọi trạng thái bền đều thuộc Thomas. Hỏi lại bạn ở những quyết định quan trọng."
        href: "/vai/thomas"
      - id: shaper
        title: "Shaper"
        tag: "định hình"
        session: "Một session liền mạch từ đầu tới cuối, không compact."
        body: "Chạy grill-with-docs, to-spec, to-tickets theo thứ tự, dừng sau spec để bạn duyệt."
        href: "/vai/shaper"
      - id: builder
        title: "Builder"
        tag: "thi công"
        session: "Một session mỗi ticket, trong worktree riêng, là người viết duy nhất ở đó."
        body: "Implement, code review hai trục, simplify, rồi lượt review chéo vendor. Commit ở mỗi ranh giới, không chỉ lúc bàn giao."
        href: "/vai/builder"
      - id: rin
        title: "Rin"
        tag: "gate"
        session: "Một session mỗi milestone, worktree tách riêng tại đúng SHA được review."
        body: "Chỉ đọc và viết đúng một file: báo cáo gate. Một vòng mỗi milestone, không lặp."
        href: "/vai/rin"
      - id: qa
        title: "QA"
        tag: "nghiệm thu"
        session: "Một session mỗi lượt walk, với sản phẩm đang chạy thật trong worktree riêng."
        body: "Dùng sản phẩm như người dùng, không đọc diff. Mặc định chỉ đọc, mọi thao tác ghi cần bạn cho phép từng lần."
        href: "/vai/qa"

  tracker:
    eyebrow: "Issue tracker"
    headline: "Mọi việc đi qua tracker, nên không việc nào lạc hướng."
    paragraphs:
      - "Trạng thái công việc sống trên tracker, không trong chat hay trí nhớ của một agent. Thomas hỏi tracker cái gì đã sẵn sàng; bạn mở board là đọc được."
      - "Không còn danh sách task trong file markdown với ô checked mà agent phải nhớ sửa. Ticket có id, status, assignee, blocking edge; đọc và ghi qua API, ai hỏi cũng nhận cùng một câu trả lời."
      - "Claim là một dòng assignee ghi và đọc lại được, nên nhiều Builder chạy song song. Issue phát sinh giữa chừng thành ticket mới, không rơi mất trong tin nhắn."
      - "Một ticket là một branch, một worktree, một PR, cùng mã ticket trong tên. Mỗi Builder một worktree; merge xong thì ticket đóng, worktree dọn."
      - "Mỗi ticket giữ nội dung việc, cách làm, câu hỏi đã hỏi, receipt đã commit. Bạn hiểu một việc bằng cách mở ticket. GitHub Issues, Jira, Linear đều dùng được; không có công cụ mới phải học."
    items:
      - text: "A stable ticket id in the TITLE"
      - text: "A status with five states — Backlog / Todo / In Progress / Done / Won't fix"
      - text: "An assignee, written and read back atomically"
      - text: "Every precondition as a queryable EDGE"
      - text: "A surface the OWNER can open and read without running a query"
    more:
      label: "Xem cấu trúc →"
      href: "/cau-truc#coordination"

  method:
    eyebrow: "mattpocock-skills"
    headline: "Astragentic chọn mattpocock-skills làm khung quản trị và phát triển dự án."
    paragraphs:
      - "Bộ skill của Matt Pocock bao trọn hai nửa của một dự án. Nửa quản trị: wayfinder định hướng, triage phân loại việc, grill hỏi cho ra yêu cầu, to-spec chốt spec, to-tickets cắt thành ticket. Nửa phát triển: implement theo TDD, code-review, simplify, diagnosing-bugs. Astragentic gắn từng skill vào đúng vai, nên Thomas quản trị và Builder thi công theo cùng một khung, từ yêu cầu đầu tiên tới PR cuối cùng."
    items:
      - id: thomas
        title: "Thomas"
        text: "triage · wayfinder · to-questionnaire · ask-matt"
      - id: shaper
        title: "Shaper"
        text: "grill-with-docs → to-spec → to-tickets"
      - id: builder
        title: "Builder"
        text: "implement"
      - title: "Dùng chung"
        text: "grilling · tdd · code-review · codebase-design · domain-modeling · research · prototype · diagnosing-bugs"
    more:
      label: "Xem lý do chọn →"
      href: "/vi-sao#why-mattpocock"

why:
  headline: "AI đã làm việc như một developer thực thụ. Câu hỏi còn lại là ai dẫn dắt."
  p1: "Vibe coding chứng minh một agent có thể nhận việc, viết code và tự kiểm thử như một kỹ sư. Khi năng lực thực thi không còn là nút thắt, giá trị của người kỹ sư chuyển sang chỗ khác: đặt yêu cầu đúng, quyết định đúng, và giữ toàn bộ quy trình đi đúng hướng."
  p2: "Astragentic được xây để bạn làm đúng phần đó. Nó tổ chức các agent thành một đội outsource theo kỷ luật SDLC quen thuộc, nhưng thiết kế lại cách phân việc, review và bàn giao để khai thác tốc độ và khối lượng công việc mà một đội người không thể duy trì."
  more: "Tìm hiểu lý do thiết kế →"

