features:
  - id: cross-vendor
    title: "A review gate in two layers, from two vendors."
    body: "Every ticket goes through a code review against Standards and Spec on Claude Code, then a cross-read on Codex. Two models from two vendors read the same diff before the merge, so quality does not rest on a single model."
    diagram: cross-vendor-arm
    crop: [builder, codex, head]
    href: /en/skills/codex-arm
  - id: tracker
    title: "Continuous operation around the issue tracker."
    body: "Every requirement, spec and ticket sits on the tracker. When a review finds new work, it is written up as a new ticket. The team runs around the clock without you watching it, and nothing falls outside the system."
    diagram: frontier-query
    crop: [frontier_query, board]
    href: /en/structure#coordination
  - id: roles
    title: "A team with names, roles and contracts."
    body: "Thomas represents you, the Shaper shapes, the Builder builds, Rin holds the gate, QA accepts. Each role carries its own contract and system context, so responsibility is clear and nobody does someone else's job. Claude Code, Codex and OpenCode all support agent profiles at this level."
    diagram: five-roles
    crop: [shaper, builder]
    href: /en/roles/thomas
  - id: runtime
    title: "One process, several runtimes."
    body: "Claude Code is the required base; Codex and OpenCode come in when you want a second vendor or another model. Which role runs on which runtime is declared in orchestrator.md; changing the runtime does not change the process."
    diagram: structure
    crop: [runtime_claude, runtime_codex]
    href: /en/tech-stack#claude-code
  - id: models
    title: "The right model for the right work."
    body: "Sonnet for the Builder and QA, where fast and cheap matters; Opus for Thomas, the Shaper and Rin, where long reasoning matters. Cost and quality are balanced per role instead of one model for everything."
    href: /en/roles/builder
  - id: oversight
    title: "Full oversight, no need to take over."
    body: "The tracker board, the herdr panes, the designs and the decisions can all be read back. Thomas comes back to you at the points that matter: UI/UX, and the choice of tech stack. You decide, the team builds."
    diagram: hub-and-spokes
    crop: [tra139, tra142]
    href: /en/roles/thomas

fit:
  eyebrow: "The right size of project"
  headline: "For long-lived projects with many parts running in parallel."
  body: "A project is not large because it has sprints or stories. It is large for four reasons: it lives long (several releases, a codebase still edited months after launch), it is wide (several modules or subsystems worked on at once), it has dependencies (this must finish before that), and it carries risk (real users, regressions that cost). Astragentic has exactly four mechanisms for those four things: the tracker and receipts keep state outside any agent's memory, claims and worktrees let several Builders run in parallel, blocking edges and the frontier query keep the order, Rin's gate and QA's walk stop a merge before it hurts. Without all four, this machinery is overhead, and an ordinary agent session is enough."
  fitsLabel: "A fit when"
  notYetLabel: "Not needed when"
  fits:
    - "There is a roadmap of several releases; the codebase lives on for months after launch."
    - "Several modules or subsystems (app, backend, admin, integrations) are built in parallel."
    - "Work depends on other work and needs ordering; real users make regressions a risk."
  notYet:
    - "One deliverable, done when delivered."
    - "One person working sequentially would keep up; nothing runs in parallel."
    - "No dependencies between pieces of work, no release after this one."

adopt:
  eyebrow: "Install"
  headline: "Five steps to put the team into your repo."
  sub: "Check the requirements, install the harness, let Claude Code adapt it to the repo, configure mattpocock-skills once, then open Thomas's session. From there, everything goes through Thomas."
  steps:
    - title: "Check the machine has the tech stack"
      lines: ["./check-requirements.sh"]
    - title: "Install the harness into your repo"
      lines: ["./install.sh /path/to/your-repo"]
    - title: "Let Claude Code adapt the harness to the repo"
      note: "Reads and executes ADAPT-HARNESS.md: tracker name, ticket prefix, docs paths."
      lines: ["cd /path/to/your-repo", "claude \"Read .astraler/releases/2.8.0/ADAPT-HARNESS.md completely and execute it.\""]
    - title: "Configure mattpocock-skills for the repo, once"
      note: "This skill declares the tracker, the triage label set and where CONTEXT.md and ADRs live; the engineering skills read that configuration afterwards."
      lines: ["claude", "/mattpocock-skills:setup-matt-pocock-skills"]
    - title: "Open Thomas's session"
      note: "Thomas reads orchestrator.md, claims the workspace and starts routing work."
      lines: ["claude --agent thomas"]
  reqEyebrow: "Tech stack"
  reqHeadline: "Seven things to have before you install."
  reqSub: "Four required, one optional, one pick-one. The `check-requirements.sh` script checks all of them for you before the install."
  reqTitle: "Required tech stack"
  requirements:
    - name: "Claude Code CLI"
      tag: "required"
      role: "Runtime for the roles. Rin's milestone gate runs only on **Claude**, so without it nothing can gate."
      href: "https://docs.anthropic.com/en/docs/claude-code"
    - name: "Codex CLI"
      tag: "optional"
      role: "Second vendor for the cross review and a fallback runtime. Without **Codex** the team runs single-provider."
      href: "https://github.com/openai/codex"
    - name: "Git ≥ 2.5 with worktree"
      tag: "required"
      role: "The isolation boundary: one **checkout per Builder**, nobody moves anyone else's HEAD."
    - name: "herdr ≥ 0.8.0 and the herdr skill"
      tag: "required"
      role: "One **pane** per agent. Thomas sees which agent is running and sends or waits on messages through the **herdr CLI**."
      href: "https://github.com/herdrdev/herdr"
    - name: "mattpocock-skills ≥ 1.2.3"
      tag: "required"
      role: "The **SDLC method** the team follows: grill, spec, tickets, implement, code review."
      href: "https://github.com/mattpocock/skills"
    - name: "Issue tracker: GitHub Issues, Jira or Linear"
      tag: "pick one"
      role: "The team's **shared memory**. Every task, claim and receipt passes through it."
    - name: "python3"
      tag: "required"
      role: "Runs the **git-guard hook** and the contract reload after compaction."
