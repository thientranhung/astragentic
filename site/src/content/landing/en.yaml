hero:
  eyebrow: "Agentic engineering · **for multi-milestone projects** · v{{meta.version}}"
  headline: "An outsourcing team made of AI agents.\nRunning by process, **around the clock**, for **large projects**."
  sub: "Astragentic puts you in the client's seat at a complete software development unit: one representative to talk to, a team of agents with clearly defined roles to build, and an issue tracker at the centre so every piece of work leaves a trace. You keep the decisions and full oversight; the execution belongs to the team."
  primary: "See the team at work ↓"
  secondary: "Deploy it in your repo"

explain:
  agents:
    eyebrow: "Agents in Astragentic"
    headline: "An agent is one coding-agent session handed a role."
    paragraphs:
      - "Every agent is a working session of Claude Code, Codex or OpenCode, launched from the command line with a defined role. It takes a task the way an employee does, hands back the result when it is finished, and can be cloned into several sessions running side by side: several Builders building at once, several QAs checking at once, like a real team."
      - "Each role carries a person's name: Thomas, Shaper, Builder, Rin, QA. The proper name keeps the role from drifting across a long context, and it lets the skills attached to a role fire on the right one."
      - "A role is defined by one declaration file in each runtime's own format, loaded into the system prompt when the session opens: Claude Code reads `.claude/agents/<role>.md`, Codex reads the launch profile `.codex/profiles/<role>.config.toml`, OpenCode reads `.opencode/agents/<role>.md`. The runtime, the model and the effort of every role are declared in one place, `orchestrator.md`."
    commands:
      label: "Start an agent over the CLI on three runtimes"
      lines:
        - "claude   --agent builder --model <model> --effort <low|medium|high|xhigh|max>"
        - "codex    --profile builder            # model and model_reasoning_effort live in the profile TOML"
        - "opencode --agent builder -m <provider>/<model>   # no effort flag"
    more:
      label: "See the five roles →"
      href: "/en/roles/thomas"

  comms:
    eyebrow: "How the agents talk"
    headline: "Dispatching a ticket opens a conversation with an address."
    paragraphs:
      - "A ticket is an issue on the tracker: a **task**, a **feature** or a **requirement** sliced small enough for one Builder to finish in one session. Each ticket carries a stable id in its title, a status, an assignee, and blocking edges to the work that must land first. Shaper creates tickets from the spec with the `to-tickets` skill; Thomas dispatches only the ones that are ready."
      - "Thomas dispatches through the `dispatch-ticket` skill: it claims the ticket on the tracker first, creates the branch and the worktree, opens a herdr pane, launches the role on its declared runtime, sends the brief, and sets a watcher straight away. The chain ticket → assignee → pane → worktree → branch → PR is one to one, so several Builders work in parallel without getting in each other’s way."
      - "When the roles all run Claude Code, the main channel is Claude Code’s built-in cross-session messaging. Every Claude Code session has a name; Thomas looks up the Builder’s with ListAgents and sends to exactly that name. In the receiving session the message shows up as a one-line preview, `› Message from @thomas: …`, expanded with ctrl+o, and the answer travels back into the session that sent it. A blocked Builder asks; Thomas reads the question, answers through that same channel, then sets a fresh Monitor and waits for the signal that the work is done. That is how the loop of dispatch, question, answer and handback runs unbroken, with nobody sitting and watching it."
      - "herdr is the visible plane and the fallback path. Each role has a named pane, Thomas reads a pane with `herdr agent read` when a session falls silent, and it uses the herdr CLI to drive a Builder on Codex or OpenCode, where SendMessage does not exist. The watcher follows the working, blocked and idle state of every pane."
      - "Sorting the questions is what moves you from human-in-the-loop to human-on-the-loop. The routine technical questions Thomas answers for you, out of the contract, the spec and the tracker. Only a real design decision comes up to you through `to-questionnaire`, in the form of a question you can answer. You are not standing inside the loop at every step; you are standing on top of it and stepping in when something needs you."
    commands:
      - label: "Answering a blocked Builder, both on Claude Code"
        lines:
          - "ListAgents                                  # Thomas looks up the Builder’s session name"
          - "@builder-TRA-142 <the answer>               # sends to exactly that name"
          - "› Message from @thomas: <the answer> (ctrl+o to expand)   # what the Builder sees"
          - "Monitor(...)   # Thomas waits for the done signal, or for something to discuss"
      - label: "Driving a Builder on Codex through herdr"
        lines:
          - 'herdr agent start "builder-TRA-142" --kind codex --pane <id> -- codex --profile builder'
          - 'herdr agent prompt <pane-id> "<brief>"'
          - "herdr agent read   <pane-id>"
    more:
      label: "See the dispatch-ticket skill →"
      href: "/en/skills/dispatch-ticket"

  roles:
    eyebrow: "What each role does"
    headline: "Five roles, five session lifetimes."
    models:
      label: "Model and effort per role"
      intro: "Each role runs on the model and effort its work needs. Thomas and Shaper reason at length, so they run Opus, Shaper at high effort because grilling and spec are where the thinking happens; Builder and QA build and test, so they run Sonnet for speed and cost; Rin gates on Opus at medium effort."
      note: "This table is read straight from `.agents/orchestrator.md` in your repo. Change one row and that role's runtime, model or effort changes at the next dispatch, with no edit to the role contract."
    items:
      - id: thomas
        title: "Thomas"
        tag: "your representative"
        session: "A resident session, alive across many tickets."
        body: "Holds the tracker, runs the frontier query, claims, dispatches and merges. It is the only role still there once a Builder has closed its session, so every durable piece of state belongs to Thomas. It comes back to you at the decisions that matter."
        href: "/en/roles/thomas"
      - id: shaper
        title: "Shaper"
        tag: "shaping"
        session: "One unbroken session end to end, never compacted."
        body: "Runs grill-with-docs, to-spec and to-tickets in that order, and stops after the spec for you to approve."
        href: "/en/roles/shaper"
      - id: builder
        title: "Builder"
        tag: "building"
        session: "One session per ticket, in its own worktree, the only writer there."
        body: "Implements, reviews the code on two axes, simplifies, then takes the cross-vendor review pass. It commits at every boundary, not only at handover."
        href: "/en/roles/builder"
      - id: rin
        title: "Rin"
        tag: "the gate"
        session: "One session per milestone, in a separate worktree at the exact SHA under review."
        body: "Reads only, and writes exactly one file: the gate report. One pass per milestone, never a loop."
        href: "/en/roles/rin"
      - id: qa
        title: "QA"
        tag: "acceptance"
        session: "One session per walk, with the product running for real in its own worktree."
        body: "Uses the product the way a user does and never reads the diff. Read-only by default; every write needs your permission, one at a time."
        href: "/en/roles/qa"

  tracker:
    eyebrow: "The issue tracker"
    headline: "Every piece of work passes through the tracker, so none of it drifts."
    paragraphs:
      - "The tracker is where the state of the work lives, not a chat log and not one agent's memory. Thomas asks the tracker what is ready; a claim is an assignee line written and read back; every precondition is a queryable edge; and you open the board and read it without running a query. Astragentic puts these five requirements on any tracker, which is why GitHub Issues, Jira and Linear all work."
    items:
      - text: "A stable ticket id in the TITLE"
      - text: "A status with five states — Backlog / Todo / In Progress / Done / Won't fix"
      - text: "An assignee, written and read back atomically"
      - text: "Every precondition as a queryable EDGE"
      - text: "A surface the OWNER can open and read without running a query"
    more:
      label: "See the structure →"
      href: "/en/structure#coordination"

  method:
    eyebrow: "mattpocock-skills"
    headline: "Astragentic does not invent an SDLC. It orchestrates a standard one."
    paragraphs:
      - "Matt Pocock's skill set is the backbone of the method: wayfinder and triage for Thomas; grill-with-docs, to-spec and to-tickets for the Shaper; implement for the Builder; and one shared craft layer of tdd, code-review, domain-modeling and diagnosing-bugs. I chose it over Superpowers because it puts the question-and-answer loop at the front, before any code is written, which is exactly where Astragentic used to fail by looping at the end. Astragentic does not compete with a method; it orchestrates one."
    items:
      - id: thomas
        title: "Thomas"
        text: "triage · wayfinder · to-questionnaire · ask-matt"
      - id: shaper
        title: "Shaper"
        text: "grill-with-docs → to-spec → to-tickets"
      - id: builder
        title: "Builder"
        text: "implement"
      - title: "Shared"
        text: "grilling · tdd · code-review · codebase-design · domain-modeling · research · prototype · diagnosing-bugs"
    more:
      label: "See why I chose it →"
      href: "/en/why#why-mattpocock"

why:
  headline: "AI already works like a real developer. The question left is who leads."
  p1: "Vibe coding proved that an agent can take a ticket, write the code and test its own work like an engineer. Once execution stops being the bottleneck, an engineer's value moves elsewhere: framing the right requirement, making the right decision, and keeping the whole process on course."
  p2: "Astragentic is built so that you do exactly that part. It organises agents into an outsourcing team under the familiar SDLC discipline, but redesigns how work is assigned, reviewed and handed back, to exploit a speed and a volume no human team can sustain."
  more: "Explore the design rationale →"

shots:
  sendmessage:
    caption: "A simulated dispatch of TRA-142: you talk to Thomas, Thomas addresses the Builder by session name over cross-session messaging, answers the technical question itself, and brings the UX decision back to you."
    video:
      mp4: /shots/dispatch.mp4
      webm: /shots/dispatch.webm
      poster: /shots/dispatch.jpg
  herdr:
    caption: "A simulated herdr workspace for one project: every agent has a named pane with a detected state, you click to read any of them, and Thomas reads and prompts through the CLI, including a Builder running Codex."
    video:
      mp4: /shots/herdr.mp4
      webm: /shots/herdr.webm
      poster: /shots/herdr.jpg
  tracker:
    caption: "The tracker board of a real project, 71 tickets"

features:
  - id: cross-vendor
    title: "A review gate in two layers, from two vendors."
    body: "Every ticket goes through Claude Code's built-in review, then through a cross-read by Codex. Two models read the same diff and argue it out before the merge. Quality no longer rests on whether the Builder had a good day."
    diagram: cross-vendor-arm
    crop: [builder, codex, head]
    href: /en/skills/codex-arm
  - id: tracker
    title: "Continuous operation around the issue tracker."
    body: "Every analysis, slice and task sits on the tracker. When a review finds new work, that work loads itself into the queue. The team runs around the clock without you watching it, and nothing falls outside the system."
    diagram: frontier-query
    crop: [frontier_query, board]
    href: /en/structure#coordination
  - id: roles
    title: "A team with names, roles and contracts."
    body: "Thomas represents you, the Shaper shapes, the Builder builds, Rin holds the gate, QA accepts. Each role carries its own system context, so responsibility is clear and nobody does someone else's job. Claude Code and Codex both support agent profiles at this level."
    diagram: five-roles
    crop: [shaper, builder]
    href: /en/roles/thomas
  - id: runtime
    title: "No runtime lock-in."
    body: "Codex alone, Claude Code alone, or both together all work. You declare which role runs on which provider in orchestrator.md; changing the provider does not change the process."
    diagram: structure
    crop: [runtime_claude, runtime_codex]
    href: /en/tech-stack#claude-code
  - id: models
    title: "The right model for the right work."
    body: "Sonnet for the Builder to implement quickly, Opus for the analysis and the slicing that need deeper reasoning. Cost and quality are balanced per role instead of one model for everything."
    href: /en/roles/builder
  - id: oversight
    title: "Full oversight, no need to take over."
    body: "The tracker board, the herdr panes, the designs and the decisions can all be read back. Thomas comes back to you at the points that matter: UI/UX, and the choice of tech stack. You decide, the team builds."
    diagram: hub-and-spokes
    crop: [tra139, tra142]
    href: /en/roles/thomas

fit:
  headline: "Built for projects with many stories and many milestones."
  body: "Astragentic is not for a single script or a weekend prototype. It pays off when the backlog is long, the milestones run back to back, and you need a team that holds steady for weeks. If your project is at that scale, the rest of this site is written for you."
  fitsLabel: "Fits when"
  notYetLabel: "Not yet when"
  fits:
    - "The backlog is long, with stories still waiting their turn."
    - "Milestones follow one another across several weeks."
    - "You need a team that holds steady, not a single run."
  notYet:
    - "A script that runs once and is done."
    - "A prototype put together over a weekend."
    - "A small change that finishes inside one session."

adopt:
  headline: "Install"
  reqHeadline: "Required tech stack"
  reqTitle: "Required tech stack"
  requirements:
    - name: "Claude Code CLI"
      tag: "required"
      role: "Runtime for the roles. Rin's milestone gate runs only on **Claude**, so without it nothing can gate."
      href: "https://docs.anthropic.com/en/docs/claude-code"
    - name: "Codex CLI"
      tag: "optional"
      role: "Second vendor for the cross review and a fallback runtime. Without **Codex** the team runs single-provider."
      href: "https://github.com/openai/codex"
    - name: "Git ≥ 2.5 with worktree"
      tag: "required"
      role: "The isolation boundary: one **checkout per Builder**, nobody moves anyone else's HEAD."
    - name: "herdr ≥ 0.8.0 and the herdr skill"
      tag: "required"
      role: "One **pane** per agent. Thomas sees which agent is running and sends or waits on messages through the **herdr CLI**."
      href: "https://github.com/herdrdev/herdr"
    - name: "mattpocock-skills ≥ 1.2.3"
      tag: "required"
      role: "The **SDLC method** the team follows: grill, spec, tickets, implement, code review."
      href: "https://github.com/mattpocock/skills"
    - name: "Issue tracker: GitHub Issues, Jira or Linear"
      tag: "pick one"
      role: "The team's **shared memory**. Every task, claim and receipt passes through it."
    - name: "python3"
      tag: "required"
      role: "Runs the **git-guard hook** and the contract reload after compaction."
