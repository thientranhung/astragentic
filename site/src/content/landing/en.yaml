hero:
  eyebrow: "Agentic engineering · **for multi-milestone projects** · v{{meta.version}}"
  headline: "An outsourcing team made of AI agents.\nRunning by process, **around the clock**, for **large projects**."
  sub: "Astragentic puts you in the client's seat at a complete software development unit: one representative to talk to, a team of agents with clearly defined roles to build, and an issue tracker at the centre so every piece of work leaves a trace. You keep the decisions and full oversight; the execution belongs to the team."
  primary: "Explore how it works ↓"
  secondary: "Understand why Astragentic exists"

explain:
  agents:
    eyebrow: "Agent"
    headline: "Each agent is an independent runtime session with a role and a contract of its own."
    paragraphs:
      - "Every agent is a working session of Claude Code, Codex or OpenCode, launched from the command line with a defined role. It takes a task the way an employee does, hands back the result when it is finished, and can be cloned into several sessions running side by side: several Builders building at once, several QAs checking at once, like a real team."
      - "Each role has a name of its own: Thomas, Shaper, Builder, Rin, QA. The name keeps the role from drifting across a long context, and it is the address for sending work, reading a pane, and attaching the right skills."
      - "A role is a declaration file in each runtime’s own format, loaded into the system prompt when the session opens; runtime, model and effort per role are declared in one place, `orchestrator.md`. The path of each file is on the Structure page."
    commands:
      label: "Start an agent over the CLI on three runtimes"
      lines:
        - "claude   --agent builder --model <model> --effort <low|medium|high|xhigh|max>"
        - "codex    --profile builder            # model and model_reasoning_effort live in the profile TOML"
        - "opencode --agent builder -m <provider>/<model>   # no effort flag"
    more:
      label: "Meet the AI team →"
      href: "/en/roles/thomas"

  comms:
    eyebrow: "How agents talk to each other"
    headline: "Dispatching a ticket opens a conversation with an address."
    paragraphs:
      - "A ticket is an issue on the tracker: a **task**, a **feature** or a **requirement** sliced small enough for one Builder to finish in one session. Each ticket carries a stable id in its title, a status, an assignee, and blocking edges to the work that must land first. Shaper creates tickets from the spec with the `to-tickets` skill; Thomas dispatches only the ones that are ready."
      - "Thomas dispatches through the `dispatch-ticket` skill: claim on the tracker, create the branch and worktree, open a herdr pane, launch the role, send the brief, arm the watcher. The chain ticket → assignee → pane → worktree → branch → PR is one-to-one, so several Builders work in parallel without treading on each other."
      - "When the roles all run Claude Code, the main channel is Claude Code’s built-in cross-session messaging. Every Claude Code session has a name; Thomas looks up the Builder’s with ListAgents and sends to exactly that name. In the receiving session the message shows up as a one-line preview, `› Message from @thomas: …`, expanded with ctrl+o, and the answer travels back into the session that sent it. A blocked Builder asks; Thomas reads the question, answers through that same channel, then sets a fresh Monitor and waits for the signal that the work is done. That is how the loop of dispatch, question, answer and handback runs unbroken, with nobody sitting and watching it."
      - "herdr is the visible plane and the fallback path: one named pane per role, a watcher reporting working, blocked, idle. Thomas reads a pane with `herdr agent read` when a session falls silent, and steers a Builder on Codex or OpenCode through the herdr CLI, where there is no cross-session messaging."
      - "Sorting the questions is what moves you from human-in-the-loop to human-on-the-loop. The routine technical questions Thomas answers for you, out of the contract, the spec and the tracker. Only a real design decision comes up to you through `to-questionnaire`, in the form of a question you can answer. You are not standing inside the loop at every step; you are standing on top of it and stepping in when something needs you."
    commands:
      - label: "Driving a Builder on Codex through herdr"
        lines:
          - 'herdr agent start "builder-TRA-142" --kind codex --pane <id> -- codex --profile builder'
          - 'herdr agent prompt <pane-id> "<brief>"'
          - "herdr agent read   <pane-id>"
    more:
      label: "Learn more about dispatch →"
      href: "/en/skills/dispatch-ticket"

  roles:
    eyebrow: "AI outsourcing team"
    headline: "What each agent does."
    figureNote: "Thomas runs the whole team: takes your request, brings in the Shaper when a spec is needed, dispatches tickets to Builders, calls Rin’s gate at every milestone and QA’s walk before a merge, then reports back to you. Every arrow in the picture is one exchange there and back."
    models:
      label: "Model and effort per role"
      intro: "Each role runs on the model and effort its work needs. Thomas and Shaper reason at length, so they run Opus, Shaper at high effort because grilling and spec are where the thinking happens; Builder and QA build and test, so they run Sonnet for speed and cost; Rin gates on Opus at medium effort."
      note: "This table is read straight from `.agents/orchestrator.md` in your repo. Change one row and that role's runtime, model or effort changes at the next dispatch, with no edit to the role contract."
    items:
      - id: thomas
        title: "Thomas"
        tag: "your representative"
        session: "A resident session, alive across many tickets."
        body: "Holds the tracker, runs the frontier query, claims, dispatches and merges. It is the only role still there once a Builder has closed its session, so every durable piece of state belongs to Thomas. It comes back to you at the decisions that matter."
        href: "/en/roles/thomas"
      - id: shaper
        title: "Shaper"
        tag: "shaping"
        session: "One unbroken session end to end, never compacted."
        body: "Runs grill-with-docs, to-spec and to-tickets in that order, and stops after the spec for you to approve."
        href: "/en/roles/shaper"
      - id: builder
        title: "Builder"
        tag: "building"
        session: "One session per ticket, in its own worktree, the only writer there."
        body: "Implements, reviews the code on two axes, simplifies, then takes the cross-vendor review pass. It commits at every boundary, not only at handback."
        href: "/en/roles/builder"
      - id: rin
        title: "Rin"
        tag: "the gate"
        session: "One session per milestone, in a separate worktree at the exact SHA under review."
        body: "Reads only, and writes exactly one file: the gate report. One pass per milestone, never a loop."
        href: "/en/roles/rin"
      - id: qa
        title: "QA"
        tag: "acceptance"
        session: "One session per walk, with the product running for real in its own worktree."
        body: "Uses the product the way a user does and never reads the diff. Read-only by default; every write needs your permission, one at a time."
        href: "/en/roles/qa"

  tracker:
    eyebrow: "The issue tracker"
    headline: "Every piece of work passes through the tracker, so none of it drifts."
    paragraphs:
      - "The state of the work lives on the tracker, not in a chat or in one agent's memory. Thomas asks the tracker what is ready; you open the board and read it."
      - "No more task lists in markdown with checkboxes an agent has to remember to tick. A ticket has an id, a status, an assignee, blocking edges; read and written through an API, so everyone gets the same answer."
      - "A claim is an assignee line written and read back, so several Builders run in parallel. An issue found mid-work becomes a new ticket instead of getting lost in a message."
      - "One ticket is one branch, one worktree, one PR, all named after the ticket. One worktree per Builder; once merged, the ticket closes and the worktree is cleaned up."
      - "Each ticket keeps what the work was, how it was done, the questions asked, the receipt committed. You understand a piece of work by opening its ticket. GitHub Issues, Jira and Linear all work; there is no new tool to learn."
    items:
      - text: "A stable ticket id in the TITLE"
      - text: "A status with five states — Backlog / Todo / In Progress / Done / Won't fix"
      - text: "An assignee, written and read back atomically"
      - text: "Every precondition as a queryable EDGE"
      - text: "A surface the OWNER can open and read without running a query"
    more:
      label: "Explore the structure →"
      href: "/en/structure#coordination"

  method:
    eyebrow: "mattpocock-skills"
    headline: "Astragentic adopts mattpocock-skills as its framework for running and building a project."
    paragraphs:
      - "Matt Pocock’s skill set covers both halves of a project. The management half: wayfinder sets direction, triage sorts the work, grill draws out the requirement, to-spec pins the spec, to-tickets cuts it into tickets. The development half: implement with TDD, code-review, simplify, diagnosing-bugs. Astragentic assigns each skill to the right role, so Thomas manages and the Builder builds inside one framework, from the first requirement to the last PR."
    items:
      - id: thomas
        title: "Thomas"
        text: "triage · wayfinder · to-questionnaire · ask-matt"
      - id: shaper
        title: "Shaper"
        text: "grill-with-docs → to-spec → to-tickets"
      - id: builder
        title: "Builder"
        text: "implement"
      - title: "Shared"
        text: "grilling · tdd · code-review · codebase-design · domain-modeling · research · prototype · diagnosing-bugs"
    more:
      label: "Learn more about the choice →"
      href: "/en/why#why-mattpocock"

why:
  eyebrow: "Why"
  headline: "AI is now a real developer. Astragentic puts you in charge of that developer team."
  p1: "A coding agent today takes the work, writes the code, runs the tests and fixes until they pass, like an engineer sitting next to you. Once execution is no longer the bottleneck, the engineer's value moves elsewhere: setting the right requirement, making the right call, and keeping the whole process on course."
  p2: "Astragentic is built so that you do exactly that part. It organises agents into an outsourcing team under the familiar SDLC discipline, and redesigns dispatch, review and handback to exploit a speed and a volume no human team can sustain."
  more: "Explore every design decision →"

