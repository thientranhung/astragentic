harness: v6.1.19
hero:
  eyebrow: "Autonomous coding · **for multi-milestone projects** · v{{meta.version}}"
  headline: "An outsourcing team made of AI agents.\nRunning by process, **24/7**, for **large projects**."
  sub: "Astragentic is a scaffold for running a team of AI agents on the orchestrator model. You talk to one representative, the team builds by role, and every piece of work goes through an issue tracker: GitHub Issues, Jira or Linear. The hard parts of running many agents are settled; the rest is yours."
  primary: "Explore how it works ↓"
  secondary: "Install it in your repo"

explain:
  runtimes:
    commands:
      label: "Start an agent over the CLI"
      lines:
        - "claude   --dangerously-skip-permissions --agent builder --model <model> --effort <low|medium|high|xhigh|max>"

  customize:
    eyebrow: "Customise"
    headline: "Everyone works with AI differently. Astragentic is the scaffold for those who work by agent orchestration."
    paragraphs:
      - "There is no single right way to work with AI. Astragentic does not choose for you."
    bullets:
      - "**The full SDLC loop**: six roles, a three-lens review plus a model from another vendor, a QA walk before merge, a slice gate when a slice closes."
      - "**The minimal shape**: two agents, one representative and one builder."
      - "**Your own infrastructure**: swap the tracker, swap the runtime, add a review step of your own."
    paragraphsAfter:
      - "Customising means editing files in your checkout. Each role is a contract, each skill a folder, each hook a script."
      - "The path from a change to a project is the release path: bump `VERSION`, add an entry to `RELEASE-NOTES.md`, then update the project with `.astraler/astragentic.sh update --apply`. Inside the project the adaptation step compares the new release with the one running and keeps the files that belong to you, such as `orchestrator.md`."

  selfRepair:
    eyebrow: "Self-repair"
    headline: "The scaffold learns from every loop, and the rule it draws goes straight into a file agents read."
    paragraphs:
      - "A team of agents repeats its own mistakes when nothing writes them down. Here something does: every incident is one line in an append-only ledger, with a fixed id, never renumbered and never deleted."
      - "A line that yields a rule puts that rule straight into a role contract, a skill or a hook — the files an agent reads at the start of its session. At the next dispatch the whole team behaves differently, not because anyone remembered, but because the text changed."
    commands:
      label: "The foot of a merge commit"
      lines:
        - "Pass: astra-review, simplify, arm"
        - "Ledger: AST-136 — --grep is BASIC regex, and every marker kind"
        - "        in this system contains parentheses"
    bullets:
      - "**It closes at merge**: the merge commit carries a `Ledger:` line naming what went in. `Ledger: none` is valid; its absence is not."
      - "**No build step**: the rule lives in the contract file itself, which the agent reads at session start. A hook reloads the contract after a session compacts."
      - "**Append-only**: a line that has not yielded a rule yet stays where it is. An open record is more honest than a ledger holding only the things already solved."
    paragraphsAfter:
      - "The same mechanism lets an **agent customise the scaffold for you**. All of Astragentic is text — contracts, skills, hooks — no binaries, no config schema to learn. You open a session inside the checkout, describe how you want to work, it proposes a diff, you approve it."
    more:
      label: "Read the whole mechanism →"
      href: "/customize/#self-repair"

  comms:
    eyebrow: "How agents talk to each other"
    headline: "Dispatching a ticket opens a conversation with an address."
    paragraphs:
      - "A ticket is an issue on the tracker, sliced small enough for one Builder to finish in one session. It carries a stable id, a status, an assignee, and blocking edges to the work that must land first."
      - "Thomas dispatches with the `dispatch-ticket` skill: claim on the tracker, create the branch and worktree, open a pane on the running host (Herdr or Orca), launch the agent for the role, send the brief. The `astragentic-dispatch` mod writes a record for the pane and wakes Thomas when the pane ends its turn. The chain ticket → assignee → pane → worktree → branch → PR is one to one, so many Builders run in parallel without contention."
      - "Between Claude Code sessions the main channel is built-in cross-session messaging. Every session has a name; Thomas looks it up with ListAgents and sends straight to it. On the receiving side the message appears as the preview line `› Message from @thomas: …`, expands with ctrl+o, and the reply travels back to the session that sent it."
      - "The terminal host is the visible plane: one named pane with a state per agent. Herdr is the default host, Orca runs alongside since 6.1.0, and each session uses exactly one host: the other host's commands are refused."
    bullets:
      - "**Technical questions**: Thomas answers them for you, from the contract, the spec and the tracker."
      - "**Design decisions**: these come up to you as numbered questions, each with a proposal, as `astra-grill-with-docs` does."
      - "**Where you stand**: on the loop, not inside every step of it."
  roles:
    eyebrow: "AI outsourcing team"
    headline: "What each agent does."
    paragraphs:
      - "Every member of the team is an agent: a **Claude Code** session opened from the command line with a fixed role. It takes work, hands back the result when it is done, and can be cloned: several Builders building at once, several QAs checking at once, like a real team."
      - "Each role has a name of its own: Thomas, BA, Shaper, Builder, QA, Quick Builder. The name keeps the agent from drifting out of its role across a long context, and it is the address for sending work, reading a pane, and attaching the right skills."
    figureNote: "You work with Thomas. Thomas brings in Shaper when a spec is needed, dispatches tickets to Builders, calls a QA walk before a merge, opens Quick Builder for small work, then reports back to you. You open BA yourself when a problem needs clarifying."
    models:
      label: "Model and effort per role"
      intro: "Each role's agent runs on the model and effort its work needs. Each role's model and effort is one line in `orchestrator.md`, so you balance cost and quality per role instead of one model for everything."
      note: "This table is read straight from `.agents/orchestrator.md` in your repo. Change one row and that role's runtime, model or effort changes at the next dispatch, with no edit to the role contract."
    items:
      - id: thomas
        title: "Thomas"
        tag: "deputy"
        session: "A resident session, alive across many tickets."
        body: "Your deputy: holds the tracker, the frontier, claims, dispatch and merges. Merges on artifacts, not on handback wording. Comes back to you at the decisions that matter."
        href: "/roles/thomas/"
      - id: ba
        title: "BA"
        tag: "clarifying the problem"
        session: "You open it yourself when needed, read-only."
        body: "Sits in the user's seat, tries the running product, states the trade-offs and the running work affected, and hands off in a file or a ticket you approve."
        href: "/roles/ba/"
      - id: shaper
        title: "Shaper"
        tag: "shaping"
        session: "One unbroken session end to end, never compacted."
        body: "Runs astra-grill-with-docs, astra-to-spec, astra-to-tickets in that order, and stops after the spec for the arm to read it."
        href: "/roles/shaper/"
      - id: builder
        title: "Builder"
        tag: "building"
        session: "One session per ticket, in its own worktree, the only writer there."
        body: "Builds test-first, runs the UI pass, the three-lens review, simplify once, then Codex's cross read. Commits at every phase boundary, not only at handback."
        href: "/roles/builder/"
      - id: qa
        title: "QA"
        tag: "acceptance"
        session: "One session per walk, with the product running for real in its own worktree."
        body: "Uses the product the way a user does and never reads the diff. Read-only by default; every write needs your permission, one at a time."
        href: "/roles/qa/"
      - id: quick-builder
        title: "Quick Builder"
        tag: "small work"
        session: "One session per small task, no ticket."
        body: "Does the change you judge by eye on an ops/* branch, shows you before and after, then fast-forwards into main."
        href: "/roles/quick-builder/"

  tracker:
    eyebrow: "Issue tracker"
    headline: "Every piece of work goes through the tracker, so none of it drifts."
    paragraphs:
      - "The state of the work is stored on the tracker, not in chat or in an agent's memory. Thomas asks the tracker what is ready; you open the board and read it."
    bullets:
      - "**A ticket is data**: id, status, assignee, blocking edges, read and written over an API. No more checkboxes in a markdown file that an agent has to remember to tick."
      - "**A claim is one assignee line**, written and read back, so many Builders run in parallel."
      - "**One ticket is one branch, one worktree, one PR**, carrying the same ticket id. After merge the ticket closes and the worktree is cleaned up."
      - "**A ticket holds the whole story**: the work, the approach, the questions asked, the receipts committed. You understand a piece of work by opening its ticket."
      - "**No new tool to learn**: GitHub Issues, Jira and Linear all work."
    items:
      - text: "A stable ticket id in the TITLE"
      - text: "A status with five states — Backlog / Todo / In Progress / Done / Won't fix"
      - text: "An assignee, written and read back atomically"
      - text: "Every precondition as a queryable EDGE"
      - text: "A surface the OWNER can open and read without running a query"
    more:
      label: "Explore the structure →"
      href: "/structure/#coordination"

  method:
    eyebrow: "astra-* skills"
    headline: "The development method is the harness's own seven astra-* skills."
    paragraphs:
      - "Each skill is tied to exactly the role and the phase that uses it, and ships in the same release as the mod and merge script that name it."
    bullets:
      - "**The shaping half**: astra-ux records the journey with you, astra-grill-with-docs asks until no branch is left open, astra-to-spec settles the spec, astra-to-tickets slices it into tickets."
      - "**The building half**: astra-implement-with-tdd, astra-ui checks the surface against the design spine, astra-review runs three lenses in one pass."
      - "**Loop at the start, not at the end**: decisions are settled before code is written, so every review after that is a bounded pass."
    items:
      - id: thomas
        title: "Thomas"
        text: "astra-ux · reconcile-tracker · dispatch-ticket · dispatch-qa-walk"
      - id: shaper
        title: "Shaper"
        text: "astra-grill-with-docs → astra-to-spec → astra-to-tickets · test-design"
      - id: builder
        title: "Builder"
        text: "astra-implement-with-tdd · astra-ui · astra-review · codex-arm"
      - title: "Shared"
        text: "simplify · code-review (Claude Code built-in) · github / jira / linear-issue-tracker"
    more:
      label: "Learn more about the reason →"
      href: "/why/#why-astra-skills"

why:
  eyebrow: "Approach"
  headline: "AI is now a real developer. Astragentic puts you in charge of that developer team."
  p1: "A coding agent today takes the work, writes the code, runs the tests and fixes until they pass. Once execution is no longer the bottleneck, the engineer's value moves elsewhere: setting the right requirement, making the right call, keeping the process on course."
  p2: "Astragentic is built so that you do exactly that part. It organises agents into an outsourcing team under the familiar SDLC discipline, and redesigns dispatch, review and handback for a speed no human team can sustain."
  more: "Explore the whole approach →"

shots:
  hero:
    caption: "A working session with Astragentic: open the host terminal, launch Thomas, ask how the project is going. Thomas reads the GitHub Issues board, finds three tickets that do not overlap, runs three Builders in parallel on three worktrees, answers the technical question itself, closes each ticket as it lands, then sends you a short report."
    video:
      mp4: /shots/hero-en.mp4
      webm: /shots/hero-en.webm
      poster: /shots/hero-en.jpg
  sendmessage:
    caption: "One dispatch of TRA-142: you talk to Thomas, Thomas addresses the Builder by session name over cross-session messaging, answers the technical question itself, and brings the UX decision back to you."
    video:
      mp4: /shots/dispatch-en.mp4
      webm: /shots/dispatch-en.webm
      poster: /shots/dispatch-en.jpg
  herdr:
    caption: "A Herdr workspace for one project: every agent has a named pane with a state, and you click to read any of them. Orca offers the same way of working on its own host."
    video:
      mp4: /shots/herdr-en.mp4
      webm: /shots/herdr-en.webm
      poster: /shots/herdr-en.jpg
  tracker:
    caption: "Three trackers, one way of working: GitHub Issues, Jira and Linear each have their own adapter in the harness, and Thomas loads the right one at session start."
    deck:
      - name: Linear
        adapter: linear-issue-tracker
        src: /shots/tracker-linear.jpg
      - name: GitHub Issues
        adapter: github-issue-tracker
        src: /shots/tracker-github.jpg
      - name: Jira
        adapter: jira-issue-tracker
        src: /shots/tracker-jira.jpg

features:
  - id: cross-vendor
    title: "Three-lens review, plus an AI from another vendor."
    body: "Every full ticket goes through astra-review with three parallel lenses (correctness, intent, standards) on Claude Code, then a read-only codex exec. Measured blind on 7 replayed tickets, Codex finds 21 real defects per run at precision 0.77. When quota runs out the arm writes NOT RUN and Opus reads instead, never counted as a pass."
    diagram: cross-vendor-arm
    crop: [builder, codex, head]
    href: /review/
  - id: tracker
    title: "Continuous operation around the issue tracker."
    body: "Every requirement, spec and ticket sits on the tracker. When a review finds new work, it is written up as a new ticket. The team runs around the clock without you watching it, and nothing falls outside the system."
    diagram: frontier-query
    crop: [frontier_query, board]
    href: /structure/#coordination
  - id: roles
    title: "A team with names, roles and contracts."
    body: "Thomas represents you, BA clarifies the problem, Shaper shapes, Builder builds, QA accepts, Quick Builder does small work. Each role carries its own contract and system context, so responsibility is clear and nobody does someone else's job."
    diagram: six-roles
    crop: [shaper, builder]
    href: /roles/thomas/
  - id: runtime
    title: "Two runtimes, two hosts, the full use of Claude Code."
    body: "Claude Code is the reference runtime: custom agents, skills, hooks, subagents, mods and the advisor are all used. Codex is the second runtime and the vendor that reads back. Agents run in Herdr or Orca panes. Model and effort per role are declared in orchestrator.md."
    diagram: structure
    crop: [runtime_claude, runtime_codex]
    href: /tech-stack/#claude-code
  - id: models
    title: "The right model for the right work."
    body: "One model-and-effort line per role in orchestrator.md. The adversarial lens runs on Opus because it was measured: Opus finds 13 real defects, Sonnet 7, on the same seven tickets. Cost and quality are balanced per role instead of one model for everything."
    href: /roles/builder/
  - id: oversight
    title: "Full oversight, no need to take over."
    body: "The tracker board, the panes in Herdr or Orca, the designs and the decisions can all be read back. Thomas comes back to you at the points that matter: UI/UX, and the choice of tech stack. You decide, the team builds."
    diagram: client-studio
    href: /roles/thomas/

fit:
  eyebrow: "The right size of project"
  headline: "For long-lived projects with many parts running in parallel."
  body: "A project is not large because it has sprints or stories. It is large because it is long-lived, wide, dependent and risky, and Astragentic has exactly one mechanism for each: the tracker and receipts keep state outside any agent's memory, claims and worktrees let several Builders run in parallel, blocking edges and the frontier query keep the order, the three-lens review, the arm, the QA walk and the slice gate stop a merge before it hurts. With none of the four, an ordinary agent session is enough."
  fitsLabel: "A fit when"
  notYetLabel: "Not needed when"
  fits:
    - "There is a roadmap of several releases; the codebase lives on for months after launch."
    - "Several modules or subsystems (app, backend, admin, integrations) are built in parallel."
    - "Work depends on other work and needs ordering; real users make regressions a risk."
  notYet:
    - "One deliverable, done when delivered."
    - "One person working sequentially would keep up; nothing runs in parallel."
    - "No dependencies between pieces of work, no release after this one."

adopt:
  eyebrow: "Install"
  headline: "Four steps to put the team into your repo."
  sub: "Astragentic installs per project, not onto the machine. Each release is a tag on GitHub; the project checks and upgrades itself with the script that ships with it."
  steps:
    - title: "Stage the latest release into the project"
      note: "Run it at the repo root. The command only copies the release into `.astraler/releases/<version>/` and writes none of your files. Pin a version with `| bash -s -- 6.1.19`."
      lines: ["cd /path/to/your-repo", "curl -fsSL https://raw.githubusercontent.com/thientranhung/astragentic/main/get.sh | bash"]
    - title: "Check the machine has the tech stack"
      lines: ["bash .astraler/releases/6.1.19/check-requirements.sh"]
    - title: "Let your current agent adapt the harness to the repo"
      note: "Claude Code or Codex reads and executes ADAPT-RUNTIME.md: tracker, ticket prefix, docs paths. Afterwards `.astraler/astragentic.sh update` tells you the installed version, the latest version and how to upgrade."
      lines: ["Read .astraler/releases/6.1.19/ADAPT-RUNTIME.md completely and execute it."]
    - title: "Open Thomas's session"
      note: "Thomas runs without per-command permission prompts so it can route continuously; model and effort follow the thomas row in orchestrator.md."
      lines: ["claude --dangerously-skip-permissions --agent thomas --model claude-opus-5 --effort medium --advisor fable"]
  reqEyebrow: "Tech stack"
  reqHeadline: "Six things to have before you install."
  reqSub: "Four required, one optional, one pick-one-of-three. The `check-requirements.sh` script checks all of them for you before the install."
  reqTitle: "Required tech stack"
  requirements:
    - name: "Claude Code CLI"
      tag: "required"
      role: "**The reference runtime**: every role runs here as a custom agent, with the harness's hooks, skills, subagents and mod."
      href: "https://docs.anthropic.com/en/docs/claude-code"
    - name: "Codex CLI"
      tag: "optional"
      role: "Second vendor (OpenAI) for the cross read via `codex exec`, no plugin needed. Without **Codex**, review runs an extra adversarial lens on Opus."
      href: "https://github.com/openai/codex"
    - name: "Git ≥ 2.5 with worktree"
      tag: "required"
      role: "The isolation boundary: one **checkout per Builder**, nobody moves anyone else's HEAD."
    - name: "Herdr ≥ 0.8.0"
      tag: "required"
      role: "The terminal host: one visible **pane** per agent. Orca can serve as the host since 6.1.0, one host per session; `check-requirements.sh` still checks for Herdr."
      href: "https://github.com/herdrdev/herdr"
    - name: "Issue tracker: GitHub Issues, Jira or Linear"
      tag: "pick one"
      role: "The team's **shared memory**. Every task, claim and receipt passes through it."
    - name: "python3"
      tag: "required"
      role: "Runs the **git-guard hook** and the contract reload after compaction."
