hero:
  eyebrow: "Autonomous coding · **for multi-milestone projects** · v{{meta.version}}"
  headline: "An outsourcing team made of AI agents.\nRunning by process, **around the clock**, for **large projects**."
  sub: "Astragentic is a scaffold for running a team of AI agents on the orchestrator model. You talk to one representative, the team builds by role, and every piece of work goes through an issue tracker: GitHub Issues, Jira or Linear. The hard parts of running many agents are settled; the rest is yours."
  primary: "Explore how it works ↓"
  secondary: "Read the Astragentic approach"

explain:
  runtimes:
    commands:
      label: "Start an agent over the CLI on three runtimes"
      lines:
        - "claude   --dangerously-skip-permissions --agent builder --model <model> --effort <low|medium|high|xhigh|max>"
        - "codex    --profile builder            # model and model_reasoning_effort live in the profile TOML"
        - "opencode --agent builder -m <provider>/<model>   # no effort flag"

  customize:
    eyebrow: "Customise"
    headline: "Everyone works with AI differently. Astragentic is the scaffold for those who work by agent orchestration."
    paragraphs:
      - "There is no single right way to work with AI. Astragentic does not choose for you."
    bullets:
      - "**The full SDLC loop**: five roles, a gate at every milestone, a QA walk before merge."
      - "**The minimal shape**: two agents, one representative and one builder."
      - "**Your own stack**: swap the tracker, swap the runtime, add a review step of your own."
    paragraphsAfter:
      - "Customising means editing files in your checkout. Each role is a contract, each skill a folder, each hook a script."
      - "The path from a change to a project is the release path: bump `VERSION`, add an entry to `RELEASE-NOTES.md`, then reinstall with `install.sh`. Inside the project the adaptation step compares the new release with the one running and keeps the files that belong to you, such as `orchestrator.md`."

  comms:
    eyebrow: "How agents talk to each other"
    headline: "Dispatching a ticket opens a conversation with an address."
    paragraphs:
      - "A ticket is an issue on the tracker, sliced small enough for one Builder to finish in one session. It carries a stable id, a status, an assignee, and blocking edges to the work that must land first."
      - "Thomas dispatches with the `dispatch-ticket` skill: claim on the tracker, create the branch and worktree, open a herdr pane, launch the agent for the role, send the brief, set a watcher. The chain ticket → assignee → pane → worktree → branch → PR is one to one, so many Builders run in parallel without stepping on each other."
      - "Between Claude Code sessions the main channel is built-in cross-session messaging. Every session has a name; Thomas looks it up with ListAgents and sends straight to it. On the receiving side the message appears as the preview line `› Message from @thomas: …`, expands with ctrl+o, and the reply travels back to the session that sent it."
      - "herdr is the visible plane and the fallback: one named pane per agent, with a watcher reporting working, blocked, idle. Thomas reads a pane with `herdr agent read` when a session goes quiet, and drives Builders on Codex or OpenCode through the herdr CLI."
    bullets:
      - "**Technical questions**: Thomas answers them for you, from the contract, the spec and the tracker."
      - "**Design decisions**: these come up to you through `to-questionnaire`, as a question you can answer."
      - "**Where you stand**: on the loop, not inside every step of it."
  roles:
    eyebrow: "AI outsourcing team"
    headline: "What each agent does."
    paragraphs:
      - "Every member of the team is an agent: a **Claude Code**, **Codex** or **OpenCode** session opened from the command line with a fixed role. It takes work, hands back the result when it is done, and can be cloned: several Builders building at once, several QAs checking at once, like a real team."
      - "Each role has a name of its own: Thomas, Shaper, Builder, Rin, QA. The name keeps the agent from drifting out of its role across a long context, and it is the address for sending work, reading a pane, and attaching the right skills."
    figureNote: "Thomas runs the whole team: takes your request, brings in the Shaper when a spec is needed, dispatches tickets to Builders, calls Rin’s gate at every milestone and QA’s walk before a merge, then reports back to you. Every arrow in the picture is one exchange there and back."
    models:
      label: "Model and effort per role"
      intro: "Each role runs on the model and effort its work needs. Thomas and Shaper reason at length, so they run Opus, Shaper at high effort. Builder and QA need speed and low cost, so they run Sonnet. Rin gates on Opus at medium effort."
      note: "This table is read straight from `.agents/orchestrator.md` in your repo. Change one row and that role's runtime, model or effort changes at the next dispatch, with no edit to the role contract."
    items:
      - id: thomas
        title: "Thomas"
        tag: "your representative"
        session: "A resident session, alive across many tickets."
        body: "Holds the tracker, runs the frontier query, claims, dispatches and merges. It is the only role still there once a Builder has closed its session, so every durable piece of state belongs to Thomas. It comes back to you at the decisions that matter."
        href: "/roles/thomas"
      - id: shaper
        title: "Shaper"
        tag: "shaping"
        session: "One unbroken session end to end, never compacted."
        body: "Runs grill-with-docs, to-spec and to-tickets in that order, and stops after the spec for you to approve."
        href: "/roles/shaper"
      - id: builder
        title: "Builder"
        tag: "building"
        session: "One session per ticket, in its own worktree, the only writer there."
        body: "Implements, reviews the code on two axes, simplifies, then takes the cross review pass where Codex re-reads the diff. It commits at every boundary, not only at handback."
        href: "/roles/builder"
      - id: rin
        title: "Rin"
        tag: "the gate"
        session: "One session per milestone, in a separate worktree at the exact SHA under review."
        body: "Reads only, and writes exactly one file: the gate report. One pass per milestone, never a loop."
        href: "/roles/rin"
      - id: qa
        title: "QA"
        tag: "acceptance"
        session: "One session per walk, with the product running for real in its own worktree."
        body: "Uses the product the way a user does and never reads the diff. Read-only by default; every write needs your permission, one at a time."
        href: "/roles/qa"

  tracker:
    eyebrow: "Issue tracker"
    headline: "Every piece of work goes through the tracker, so none of it drifts."
    paragraphs:
      - "The state of the work is stored on the tracker, not in chat or in an agent's memory. Thomas asks the tracker what is ready; you open the board and read it."
    bullets:
      - "**A ticket is data**: id, status, assignee, blocking edges, read and written over an API. No more checkboxes in a markdown file that an agent has to remember to tick."
      - "**A claim is one assignee line**, written and read back, so many Builders run in parallel."
      - "**One ticket is one branch, one worktree, one PR**, carrying the same ticket id. After merge the ticket closes and the worktree is cleaned up."
      - "**A ticket holds the whole story**: the work, the approach, the questions asked, the receipts committed. You understand a piece of work by opening its ticket."
      - "**No new tool to learn**: GitHub Issues, Jira and Linear all work."
    items:
      - text: "A stable ticket id in the TITLE"
      - text: "A status with five states — Backlog / Todo / In Progress / Done / Won't fix"
      - text: "An assignee, written and read back atomically"
      - text: "Every precondition as a queryable EDGE"
      - text: "A surface the OWNER can open and read without running a query"
    more:
      label: "Explore the structure →"
      href: "/structure#coordination"

  method:
    eyebrow: "mattpocock-skills"
    headline: "Astragentic runs on mattpocock-skills for both halves of a project."
    paragraphs:
      - "Matt Pocock's skills cover both halves of a project, and Astragentic attaches each skill to the right role."
    bullets:
      - "**The management half**: wayfinder sets direction, triage sorts the work, grill draws out the requirements, to-spec settles the spec, to-tickets slices it into tickets."
      - "**The engineering half**: implement by TDD, code-review, simplify, diagnosing-bugs."
      - "**One method for both**: Thomas manages and Builder builds by the same rules, from the first requirement to the last PR."
    items:
      - id: thomas
        title: "Thomas"
        text: "triage · wayfinder · to-questionnaire · ask-matt"
      - id: shaper
        title: "Shaper"
        text: "grill-with-docs → to-spec → to-tickets"
      - id: builder
        title: "Builder"
        text: "implement"
      - title: "Shared"
        text: "grilling · tdd · code-review · codebase-design · domain-modeling · research · prototype · diagnosing-bugs"
    more:
      label: "Learn more about the choice →"
      href: "/why#why-mattpocock"

why:
  eyebrow: "Approach"
  headline: "AI is now a real developer. Astragentic puts you in charge of that developer team."
  p1: "A coding agent today takes the work, writes the code, runs the tests and fixes until they pass. Once execution is no longer the bottleneck, the engineer's value moves elsewhere: setting the right requirement, making the right call, keeping the process on course."
  p2: "Astragentic is built so that you do exactly that part. It organises agents into an outsourcing team under the familiar SDLC discipline, and redesigns dispatch, review and handback for a speed no human team can sustain."
  more: "Explore every design decision →"

shots:
  hero:
    caption: "A working session with Astragentic: open herdr, launch Thomas, ask how the project is going. Thomas reads the GitHub Issues board, finds three tickets that do not overlap, runs three Builders in parallel on three worktrees, answers the technical question itself, closes each ticket as it lands, then sends you a short report."
    video:
      mp4: /shots/hero-en.mp4
      webm: /shots/hero-en.webm
      poster: /shots/hero-en.jpg
  sendmessage:
    caption: "One dispatch of TRA-142: you talk to Thomas, Thomas addresses the Builder by session name over cross-session messaging, answers the technical question itself, and brings the UX decision back to you."
    video:
      mp4: /shots/dispatch-en.mp4
      webm: /shots/dispatch-en.webm
      poster: /shots/dispatch-en.jpg
  herdr:
    caption: "A herdr workspace for one project: every agent has a named pane with a detected state, you click to read any of them, and Thomas reads and prompts through the CLI, including a Builder running Codex."
    video:
      mp4: /shots/herdr-en.mp4
      webm: /shots/herdr-en.webm
      poster: /shots/herdr-en.jpg
  tracker:
    caption: "Three trackers, one way of working: GitHub Issues, Jira and Linear each have their own adapter in the harness, and Thomas loads the right one at session start."
    deck:
      - name: Linear
        adapter: linear-issue-tracker
        src: /shots/tracker-linear.jpg
      - name: GitHub Issues
        adapter: github-issue-tracker
        src: /shots/tracker-github.jpg
      - name: Jira
        adapter: jira-issue-tracker
        src: /shots/tracker-jira.jpg

features:
  - id: cross-vendor
    title: "A review gate in two layers, two AIs from two vendors."
    body: "Every ticket goes through a code review against Standards and Spec on Claude Code, then a cross-read on Codex. Two models from two vendors read the same diff before the merge, so quality does not rest on a single model."
    diagram: cross-vendor-arm
    crop: [builder, codex, head]
    href: /en/skills/codex-arm
  - id: tracker
    title: "Continuous operation around the issue tracker."
    body: "Every requirement, spec and ticket sits on the tracker. When a review finds new work, it is written up as a new ticket. The team runs around the clock without you watching it, and nothing falls outside the system."
    diagram: frontier-query
    crop: [frontier_query, board]
    href: /en/structure#coordination
  - id: roles
    title: "A team with names, roles and contracts."
    body: "Thomas represents you, the Shaper shapes, the Builder builds, Rin holds the gate, QA accepts. Each role carries its own contract and system context, so responsibility is clear and nobody does someone else's job. Claude Code, Codex and OpenCode all support agent profiles at this level."
    diagram: five-roles
    crop: [shaper, builder]
    href: /en/roles/thomas
  - id: runtime
    title: "One process, several runtimes."
    body: "Claude Code is the required base; Codex and OpenCode come in when you want a second vendor or another model. Which role runs on which runtime is declared in orchestrator.md; changing the runtime does not change the process."
    diagram: structure
    crop: [runtime_claude, runtime_codex]
    href: /en/tech-stack#claude-code
  - id: models
    title: "The right model for the right work."
    body: "Sonnet for the Builder and QA, where fast and cheap matters; Opus for Thomas, the Shaper and Rin, where long reasoning matters. Cost and quality are balanced per role instead of one model for everything."
    href: /en/roles/builder
  - id: oversight
    title: "Full oversight, no need to take over."
    body: "The tracker board, the herdr panes, the designs and the decisions can all be read back. Thomas comes back to you at the points that matter: UI/UX, and the choice of tech stack. You decide, the team builds."
    diagram: hub-and-spokes
    crop: [tra139, tra142]
    href: /en/roles/thomas

fit:
  eyebrow: "The right size of project"
  headline: "For long-lived projects with many parts running in parallel."
  body: "A project is not large because it has sprints or stories. It is large because it is long-lived, wide, dependent and risky, and Astragentic has one mechanism for each: the tracker and receipts keep state outside any agent's memory, claims and worktrees let several Builders run in parallel, blocking edges and the frontier query keep the order, Rin's gate and QA's walk stop a merge before it hurts. Without all four, an ordinary agent session is enough."
  fitsLabel: "A fit when"
  notYetLabel: "Not needed when"
  fits:
    - "There is a roadmap of several releases; the codebase lives on for months after launch."
    - "Several modules or subsystems (app, backend, admin, integrations) are built in parallel."
    - "Work depends on other work and needs ordering; real users make regressions a risk."
  notYet:
    - "One deliverable, done when delivered."
    - "One person working sequentially would keep up; nothing runs in parallel."
    - "No dependencies between pieces of work, no release after this one."

adopt:
  eyebrow: "Install"
  headline: "Five steps to put the team into your repo."
  sub: "Astragentic installs from your checkout into each project folder, not onto the machine. One checkout serves many projects, and every customisation you make there reaches them by this same install path."
  steps:
    - title: "Check the machine has the tech stack"
      lines: ["./check-requirements.sh"]
    - title: "Install the harness into your repo"
      note: "Run it from the **Astragentic** folder, pointing at the project folder. It only copies one release into that project's `.astraler/releases/` and edits none of your files. One Astragentic checkout serves many projects; you tune and upgrade the harness in one place, then install it again per project."
      lines: ["./install.sh /path/to/your-repo"]
    - title: "Let Claude Code adapt the harness to the repo"
      note: "Reads and executes ADAPT-HARNESS.md: tracker name, ticket prefix, docs paths."
      lines: ["cd /path/to/your-repo", "claude \"Read .astraler/releases/2.8.0/ADAPT-HARNESS.md completely and execute it.\""]
    - title: "Configure mattpocock-skills for the repo, once"
      note: "This skill declares the tracker, the triage label set and where CONTEXT.md and ADRs live; the engineering skills read that configuration afterwards."
      lines: ["claude", "/mattpocock-skills:setup-matt-pocock-skills"]
    - title: "Open Thomas's session"
      note: "Thomas runs without per-command permission prompts so it can route continuously; model and effort follow the thomas row in orchestrator.md."
      lines: ["claude --dangerously-skip-permissions --agent thomas --model claude-opus-5 --effort medium"]
  reqEyebrow: "Tech stack"
  reqHeadline: "Seven things to have before you install."
  reqSub: "Five required, one optional, one pick-one-of-three. The `check-requirements.sh` script checks all of them for you before the install."
  reqTitle: "Required tech stack"
  requirements:
    - name: "Claude Code CLI"
      tag: "required"
      role: "Runtime for the roles. Rin's milestone gate runs only on **Claude**, so without it nothing can gate."
      href: "https://docs.anthropic.com/en/docs/claude-code"
    - name: "Codex CLI"
      tag: "optional"
      role: "Second vendor for the cross review and a fallback runtime. Without **Codex** the team runs single-provider."
      href: "https://github.com/openai/codex"
    - name: "Git ≥ 2.5 with worktree"
      tag: "required"
      role: "The isolation boundary: one **checkout per Builder**, nobody moves anyone else's HEAD."
    - name: "herdr ≥ 0.8.0 and the herdr skill"
      tag: "required"
      role: "One **pane** per agent. Thomas sees which agent is running and sends or waits on messages through the **herdr CLI**."
      href: "https://github.com/herdrdev/herdr"
    - name: "mattpocock-skills ≥ 1.2.3"
      tag: "required"
      role: "The **SDLC method** the team follows: grill, spec, tickets, implement, code review."
      href: "https://github.com/mattpocock/skills"
    - name: "Issue tracker: GitHub Issues, Jira or Linear"
      tag: "pick one"
      role: "The team's **shared memory**. Every task, claim and receipt passes through it."
    - name: "python3"
      tag: "required"
      role: "Runs the **git-guard hook** and the contract reload after compaction."
