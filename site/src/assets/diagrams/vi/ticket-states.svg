        <text x="72" y="424" class="t-dim" font-size="10" font-weight="600">03 / Outcomes</text>

        <!-- Primary lifecycle rail -->
        <path d="M 154 157 L 748 157" class="a-emphasis" stroke-width="2.2" marker-end="url(#arrowhead-emphasis)"/>

